<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEF Controller</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav>
      <button class="nav-btn active" data-nav="home"></button>
      <button class="nav-btn" data-nav="log"></button>
      <div class="nav-spacer"></div>
      <button class="nav-btn" data-nav="settings"></button>
    </nav>
    <div class="content-shell">
      <div id="connection-note" class="connection-note hidden" role="status"></div>
      <main id="main" aria-busy="true">
        <div class="page boot-skeleton" aria-hidden="true"><div class="boot-status"></div><div class="boot-card"></div><div class="boot-card"></div></div>
      </main>
    </div>
  </div>
  <div id="toasts" class="toast-area" aria-live="polite" aria-atomic="false"></div>

  <script src="texts.js"></script>
  <script src="controller_core.js"></script>
  <script src="controller_logs.js"></script>
  <script src="controller_settings.js"></script>
  <script src="controller.js"></script>
</body>
</html>
