<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEF Controller</title>
  <style>
    :root {
      color-scheme: light dark;
      --teal: #0d9488; --teal-ink: #0f766e; --teal-soft: #f0fdfa; --teal-line: #99f6e4;
      --bg: #f3f3f3; --panel: #ffffff; --panel-flat: #fafafa; --panel-alt: #fcfcfc;
      --line: #e5e5e5; --line-soft: #f0f0f0; --line-faint: #f5f5f5;
      --ink: #1a1a1a; --muted: #616161; --faint: #8a8a8a; --ghost: #a0a0a0; --hair: #c4c4c4;
      --btn-line: #d1d1d1; --btn-line-soft: #e0e0e0;
      --danger: #dc2626;
      --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-ink: #92400e;
      --test: #6d28d9; --test-bg: #f5f3ff; --test-line: #ddd6fe;
      --ok-bg: #f0fdfa; --ok-ink: #0f766e; --ok-line: #99f6e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --teal-soft: #10322e; --teal-line: #246158;
        --bg: #202324; --panel: #2b2f30; --panel-flat: #272b2c; --panel-alt: #2e3233;
        --line: rgba(255,255,255,.12); --line-soft: rgba(255,255,255,.08); --line-faint: rgba(255,255,255,.05);
        --ink: #f1f4f3; --muted: #b7c0be; --faint: #93a09d; --ghost: #7d8a87; --hair: #5a6663;
        --btn-line: rgba(255,255,255,.22); --btn-line-soft: rgba(255,255,255,.14);
        --warn-bg: #372a10; --warn-line: #6b5518; --warn-ink: #fcd34d;
        --test: #c4b5fd; --test-bg: #2e2450; --test-line: #4c3d85;
        --ok-bg: #123430; --ok-ink: #5eead4; --ok-line: #246158;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-width: 620px; background: var(--bg); color: var(--ink);
      font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .shell { display: flex; height: 100vh; }
    nav { width: 148px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 6px 12px; }
    .nav-btn {
      position: relative; display: flex; align-items: center; gap: 11px; padding: 10px 12px;
      border: 0; background: transparent; border-radius: 6px; font-size: 13.5px; text-align: left;
    }
    .nav-btn:hover { background: rgba(127,127,127,.10); }
    .nav-btn.active { background: rgba(127,127,127,.16); font-weight: 600; }
    .nav-btn.active::before {
      content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 16px; border-radius: 2px; background: var(--teal);
    }
    .nav-spacer { flex: 1; }
    main {
      flex: 1; min-width: 0; background: var(--panel); overflow-y: auto;
      border: 1px solid var(--line); border-right: 0; border-bottom: 0; border-top-left-radius: 8px;
    }
    .page {
      width: 100%; min-height: 100%; margin: 0;
      padding: clamp(22px, 2.6vw, 36px) clamp(24px, 3.2vw, 48px) 36px;
    }
    .page.hidden { display: none; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; flex: 1; min-width: max-content; }
    .page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
    .page-head h1 { margin-right: auto; }

    /* ── 状态条 ── */
    .status-bar {
      display: flex; align-items: center; gap: 12px; padding: 13px 16px; margin-bottom: 14px;
      background: var(--panel-flat); border: 1px solid var(--line); border-radius: 10px;
    }
    .connection-note {
      display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 9px 12px;
      color: var(--warn-ink); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; font-size: 12.5px;
    }
    .connection-note.hidden { display: none; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: #94a3b8; }
    .dot.on { background: #10b981; }
    .status-name { font-size: 14px; font-weight: 600; }
    .status-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
    .power-switch {
      margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 8px 16px; flex-shrink: 0;
      border: 1px solid var(--btn-line); background: var(--panel); border-radius: 7px;
      font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .power-switch.on { background: var(--teal); border-color: var(--teal); color: #fff; }
    .power-switch.pending { opacity: .65; cursor: wait; }
    .standby-note {
      display: flex; align-items: center; gap: 8px; margin: -2px 0 12px; padding: 9px 12px;
      color: #475569; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12.5px;
    }
    .standby-note.hidden { display: none; }
    .setup-note { color: var(--ok-ink); background: var(--ok-bg); border-color: var(--ok-line); }
    .setup-note button { margin-left: auto; white-space: nowrap; }
    @media (prefers-color-scheme: dark) {
      .standby-note { color: #cbd5e1; background: #27313b; border-color: #3b4754; }
    }

    /* ── 卡片 ── */
    .card { padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
    .card.dim { background: var(--panel-flat); }
    .card.dim .vol-row, .card.dim .input-grid { opacity: .52; }
    .card.dim .card-label, .card.dim .vol-display { opacity: .78; }
    .card-label { font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }

    /* ── 音量 ── */
    .vol-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .vol-display {
      border: 0; background: transparent; font-size: 32px; font-weight: 700; padding: 0; line-height: 1;
      font-variant-numeric: tabular-nums; cursor: text;
    }
    .vol-edit {
      width: 66px; border: 1.5px solid var(--teal); border-radius: 6px; font-size: 26px; font-weight: 700;
      text-align: right; padding: 2px 6px; outline: none; font-variant-numeric: tabular-nums; background: var(--panel);
    }
    .vol-row { display: flex; align-items: center; gap: 10px; }
    .vol-icon-btn {
      width: 36px; height: 36px; border: 1px solid var(--btn-line-soft); background: var(--panel);
      border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nudge-btn {
      width: 30px; height: 30px; border: 1px solid var(--btn-line-soft); background: var(--panel);
      border-radius: 7px; color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nudge-btn:hover:not(:disabled), .vol-icon-btn:hover:not(:disabled) { border-color: var(--teal); }
    .nudge-btn:disabled, .vol-icon-btn:disabled, .vol-display:disabled, .slider:disabled { cursor: default; }
    .slider-wrap { flex: 1; min-width: 0; }
    .slider { --volume: 0%; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; }
    .slider::-webkit-slider-runnable-track {
      height: 6px; border-radius: 999px; transition: box-shadow .2s ease;
      background: linear-gradient(to right, var(--teal) 0, var(--teal) var(--volume), rgba(127,127,127,.25) var(--volume));
    }
    .slider::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px; margin-top: -6px; border: 0; border-radius: 50%;
      background: var(--teal); box-shadow: 0 1px 2px rgba(0,0,0,.2);
      transition: box-shadow .18s ease, transform .12s ease;
    }
    .slider:hover:not(:disabled)::-webkit-slider-thumb {
      box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 0 0 5px rgba(13,148,136,.16);
    }
    .slider:active:not(:disabled)::-webkit-slider-thumb {
      transform: scale(1.15);
      box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 0 0 8px rgba(13,148,136,.20), 0 0 16px rgba(13,148,136,.60);
    }
    .slider:active:not(:disabled)::-webkit-slider-runnable-track { box-shadow: 0 0 10px rgba(13,148,136,.30); }
    .slider:focus-visible::-webkit-slider-thumb { outline: 3px solid rgba(13,148,136,.25); outline-offset: 2px; }
    .ticks { display: flex; justify-content: space-between; margin-top: 4px; }
    .ticks span { font-size: 10px; color: var(--hair); font-variant-numeric: tabular-nums; }
    .mute-note { display: flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; color: var(--danger); }
    .mute-note.hidden { display: none; }

    /* ── 输入源 ── */
    .input-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
    .input-btn:last-child:nth-child(3n + 1) { grid-column: 2; }
    .input-btn {
      display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 8px;
      border: 1px solid var(--btn-line-soft); background: var(--panel); border-radius: 8px; font-size: 13px;
    }
    .input-btn:hover:not(:disabled) { border-color: var(--teal); }
    .input-btn.active {
      border-color: var(--teal); background: var(--teal-soft); color: var(--teal-ink);
      font-weight: 600; box-shadow: inset 0 0 0 1px var(--teal);
    }

    /* ── 设备信息（折叠） ── */
    .card-flat { background: var(--panel-flat); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .info-head {
      width: 100%; display: flex; align-items: center; gap: 8px; padding: 11px 14px;
      border: 0; background: transparent; color: var(--muted); text-align: left;
    }
    .info-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .info-summary { margin-left: auto; font-size: 12px; color: var(--ghost); }
    .info-grid { margin: 0; padding: 0 14px 14px 36px; }
    .info-grid.hidden { display: none; }
    .info-row { display: flex; padding: 5px 0; border-top: 1px solid var(--line-soft); }
    .info-row dt { width: 96px; font-size: 12.5px; color: var(--faint); margin: 0; flex-shrink: 0; }
    .info-row dd { font-size: 12.5px; margin: 0; font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
    .info-row.health dd { font-family: inherit; }

    /* ── 日志 ── */
    .ghost-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 13px;
      border: 1px solid var(--btn-line); background: var(--panel); border-radius: 6px; font-size: 13px;
    }
    .ghost-btn:hover { border-color: var(--faint); }
    .search-box {
      position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 8px;
      border: 1px solid var(--btn-line); background: var(--panel); border-radius: 7px; color: var(--faint);
    }
    .search-box:focus-within { border-color: var(--teal); }
    .search-box input { flex: 1; border: 0; outline: none; font-size: 13.5px; background: transparent; color: var(--ink); }
    .search-box input[type="search"]::-webkit-search-cancel-button { display: none; }
    .log-toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .severity-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .severity-hint { font-size: 12px; color: var(--faint); }
    .severity-track { display: flex; gap: 5px; flex-wrap: wrap; }
    .severity-btn {
      padding: 4px 9px; border: 1px solid var(--btn-line-soft); background: var(--panel); border-radius: 999px;
      font: 600 11.5px ui-monospace, Consolas, monospace; color: var(--ghost);
    }
    .severity-btn:hover:not(:disabled) { border-color: var(--teal); color: var(--ink); }
    .severity-btn:disabled { opacity: .38; cursor: default; }
    .severity-btn.active.ERROR { color: #991b1b; border-color: #fecaca; background: #fef2f2; }
    .severity-btn.active.WARN  { color: #92400e; border-color: #fde68a; background: #fffbeb; }
    .severity-btn.active.EVENT { color: #5b21b6; border-color: #ddd6fe; background: #f5f3ff; }
    .severity-btn.active.STATE { color: #155e75; border-color: #a5f3fc; background: #ecfeff; }
    .severity-btn.active.STEP  { color: #166534; border-color: #bbf7d0; background: #f0fdf4; }
    .severity-btn.active.INFO  { color: #334155; border-color: #cbd5e1; background: #f8fafc; }
    @media (prefers-color-scheme: dark) {
      .severity-btn.active.ERROR { color: #fca5a5; border-color: #7f1d1d; background: #450a0a; }
      .severity-btn.active.WARN  { color: #fcd34d; border-color: #78350f; background: #451a03; }
      .severity-btn.active.EVENT { color: #c4b5fd; border-color: #4c1d95; background: #2e1065; }
      .severity-btn.active.STATE { color: #67e8f9; border-color: #155e75; background: #083344; }
      .severity-btn.active.STEP  { color: #86efac; border-color: #14532d; background: #052e16; }
      .severity-btn.active.INFO  { color: #cbd5e1; border-color: #334155; background: #1e293b; }
    }
    .log-box {
      background: #0f172a; border-radius: 10px; padding: 12px; flex: 1; min-height: 0;
      overflow-y: auto; font: 12px/1.65 ui-monospace, "Cascadia Mono", Consolas, monospace;
      overscroll-behavior: contain; scrollbar-color: #475569 transparent;
    }
    .log-line { display: flex; gap: 8px; padding: 3px 6px; border-radius: 4px; align-items: flex-start; }
    .log-line.ERROR { background: rgba(220,38,38,.15); box-shadow: inset 2px 0 0 #dc2626; }
    .log-line.WARN { background: rgba(217,119,6,.12); box-shadow: inset 2px 0 0 #d97706; }
    .log-time { color: #64748b; flex-shrink: 0; }
    .log-lvl {
      flex-shrink: 0; width: 48px; text-align: center; border-radius: 3px;
      font-size: 10px; font-weight: 700; padding: 1px 0; border: 1px solid;
    }
    .log-lvl.ERROR { color: #fca5a5; border-color: #7f1d1d; background: #450a0a; }
    .log-lvl.WARN  { color: #fcd34d; border-color: #78350f; background: #451a03; }
    .log-lvl.EVENT { color: #c4b5fd; border-color: #4c1d95; background: #2e1065; }
    .log-lvl.STATE { color: #67e8f9; border-color: #155e75; background: #083344; }
    .log-lvl.STEP  { color: #86efac; border-color: #14532d; background: #052e16; }
    .log-lvl.INFO  { color: #cbd5e1; border-color: #334155; background: #1e293b; }
    .log-txt { color: #cbd5e1; word-break: break-all; white-space: pre-wrap; }
    .log-txt mark { color: #fef3c7; background: #854d0e; border-radius: 2px; padding: 0 1px; }
    .log-empty { padding: 30px; text-align: center; color: #475569; }
    .log-foot { margin: 8px 2px 0; font-size: 12px; color: var(--ghost); }

    /* ── 设置 ── */
    .saved-flash {
      display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600;
      color: var(--teal-ink); background: var(--teal-soft); border-radius: 999px; padding: 4px 10px;
    }
    .saved-flash.hidden { display: none; }
    .sec-title { margin: 18px 0 10px; font-size: 16px; font-weight: 600; }
    .sec-desc { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .set-row { display: flex; align-items: center; gap: 14px; }
    .set-label { font-size: 14px; font-weight: 600; }
    .set-desc { font-size: 12px; color: var(--faint); margin-top: 2px; }
    .divider { height: 1px; background: var(--line-soft); margin: 14px 0; }
    select, .text-input {
      padding: 7px 10px; border: 1px solid var(--btn-line); border-radius: 6px; font-size: 13.5px;
      background: var(--panel); min-width: 130px; outline: none;
    }
    select:focus, .text-input:focus { border-color: var(--teal); }
    .text-input { font-family: ui-monospace, Consolas, monospace; }
    .target-val { text-align: right; }
    .target-ip { font-size: 11.5px; color: var(--ghost); font-family: ui-monospace, Consolas, monospace; margin-top: 2px; }
    .primary-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 15px; border: 0; flex-shrink: 0;
      background: var(--teal); color: #fff; border-radius: 6px; font-size: 13px; font-weight: 600;
    }
    .primary-btn:hover:not(:disabled) { background: #0b7f74; }
    .primary-btn:disabled { opacity: .6; }
    .lang-switch { display: flex; padding: 3px; border: 1px solid var(--btn-line); border-radius: 7px; background: var(--panel-flat); }
    .lang-btn { border: 0; background: transparent; border-radius: 5px; padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
    .lang-btn.active { background: var(--panel); color: var(--teal-ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
    /* ── 选择扬声器弹窗 ── */
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes pop-in { from { opacity: 0; transform: scale(.97) translateY(6px); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .dlg-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      animation: fade-in .15s ease;
    }
    .dlg {
      width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.30); padding: 18px 20px 16px;
      animation: pop-in .16s ease; display: flex; flex-direction: column; max-height: calc(100vh - 48px); overflow-y: auto;
    }
    .dlg-head { display: flex; align-items: center; gap: 9px; }
    .dlg-head-icon {
      width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--panel);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .dlg-title { font-size: 17px; font-weight: 600; }
    .dlg-x {
      margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent;
      border-radius: 6px; color: var(--faint); display: flex; align-items: center; justify-content: center;
    }
    .dlg-x:hover { background: rgba(127,127,127,.12); color: var(--ink); }
    .dlg-sub { margin: 8px 0 14px; font-size: 13px; color: var(--muted); }
    .scan-bar {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin-bottom: 10px;
      background: var(--teal-soft); border: 1px solid rgba(13,148,136,.28); border-radius: 8px;
    }
    .scan-bar.failed { background: var(--warn-bg); border-color: var(--warn-line); }
    .scan-bar.failed .scan-text { color: var(--warn-ink); }
    .scan-text { font-size: 12.5px; color: var(--teal-ink); flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
    .rescan-btn {
      display: flex; align-items: center; gap: 4px; padding: 4px 10px; flex-shrink: 0;
      border: 1px solid rgba(13,148,136,.4); background: var(--panel); border-radius: 6px;
      font-size: 12px; color: var(--teal-ink); font-weight: 600;
    }
    .rescan-btn:hover { border-color: var(--teal); }
    .dlg-list { display: flex; flex-direction: column; gap: 7px; min-height: 68px; }
    .skeleton {
      height: 60px; border-radius: 9px; background-size: 200% 100%; animation: shimmer 1.3s infinite;
      background-image: linear-gradient(90deg, rgba(127,127,127,.10) 25%, rgba(127,127,127,.22) 50%, rgba(127,127,127,.10) 75%);
    }
    .sp-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left;
      border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
    }
    .sp-item:hover { border-color: var(--teal); }
    .sp-item.current { border-color: var(--teal); background: var(--teal-soft); box-shadow: inset 0 0 0 1px var(--teal); cursor: default; }
    .sp-icon {
      width: 34px; height: 34px; border-radius: 8px; background: rgba(127,127,127,.12); color: var(--muted);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sp-item.current .sp-icon { background: var(--teal); color: #fff; }
    .sp-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cur-tag { font-size: 10.5px; font-weight: 700; color: var(--teal-ink); background: rgba(13,148,136,.16); border-radius: 5px; padding: 1px 7px; flex-shrink: 0; }
    .sp-meta { font-size: 11.5px; color: var(--faint); margin-top: 2px; font-family: ui-monospace, Consolas, monospace; }
    .sel-hint { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--teal); flex-shrink: 0; }
    .dlg-empty { padding: 24px; text-align: center; color: var(--ghost); font-size: 13px; }
    .manual-link {
      align-self: flex-start; margin-top: 12px; border: 0; background: transparent;
      color: var(--teal); font-size: 13px; padding: 4px 0; font-weight: 500;
    }
    .manual-link:hover { text-decoration: underline; }
    .manual-box { margin-top: 12px; padding: 13px; background: var(--panel-flat); border: 1px solid var(--line); border-radius: 9px; }

  const api = async (method, args = [], { signal = undefined, silent = false } = {}) => {
    const response = await fetch(`/api/${method}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ args }), signal,
    });
    const payload = await response.json();
    if (!response.ok || payload.error) {
      const detail = payload.error || t("request_failed");
      if (!silent) toast("error", t("controller_error"), detail);
      throw new Error(detail);
    }
    return payload.result;
  };

    "Wake": "power", "Standby": "power", "Early Standby": "power", "Endsession Standby": "power",
  }[title] || "general");
  const toastKind = (level, title, detail, channel) => {
    const value = `${title || ""} ${detail || ""}`;
    if (level === "error") return "error";
    if (channel === "volume") return "volume";
    if (channel === "power") return value.toLowerCase().includes("standby") || value.includes("待机") ? "standby" : "success";
    if (channel === "save" || level === "success") return "success";

    clearTimeout(toastTimers.get(channel));

    toastNodes.delete(channel);

  function toast(level, title, detail = "", channel = toastChannel(title), ttl = 3600, visualKind = "") {
    let el = toastNodes.get(channel);
    if (!el) {
      const area = $("#toasts");
      while (area.children.length >= 3) {
        const oldest = area.firstElementChild;
        const oldestChannel = oldest?.dataset.channel;
        if (oldestChannel) dismissToast(oldestChannel); else oldest?.remove();
      }
      el = document.createElement("div");
      el.dataset.channel = channel;
      el.innerHTML = `<span class="toast-icon"></span><div class="toast-body"><b></b><small></small></div><button class="toast-close" title="${t("close")}" aria-label="${t("close")}">${icon("x", 13)}</button>`;
      el.querySelector(".toast-close").addEventListener("click", () => dismissToast(channel));
      area.append(el);
      toastNodes.set(channel, el);

    const kind = visualKind || toastKind(level, title, detail, channel);
    el.className = `toast ${level || "info"} kind-${kind}`;
    el.setAttribute("role", level === "error" ? "alert" : "status");

  function bindHome() {
    $("#power-btn").addEventListener("click", () => {
      if (powerPending) return;
      powerPending = true;
      powerPendingTarget = !Boolean(state?.speaker?.on);
      powerPendingStage = "sending";
      armPowerPendingTimeout(12000);
      syncHome();
      bridge.togglePower().catch(() => { clearPowerPending(); syncHome(); });
    });

    const slider = $("#vol-slider");
    slider.addEventListener("pointerdown", e => {
      draggingVol = true;
      activeVolumePointer = e.pointerId;
      if (slider.setPointerCapture) slider.setPointerCapture(e.pointerId);
    });
    const finishDragging = e => finishVolumeDrag(e.pointerId);
    slider.addEventListener("pointerup", finishDragging);
    slider.addEventListener("pointercancel", finishDragging);
    slider.addEventListener("lostpointercapture", finishDragging);
    window.addEventListener("pointerup", finishDragging);
    window.addEventListener("pointercancel", finishDragging);
    window.addEventListener("blur", () => finishVolumeDrag());
    slider.addEventListener("input", () => {
      muted = false;
      previewVolume(+slider.value);
    });
    $("#vol-down").addEventListener("click", () => nudge(-1));
    $("#vol-up").addEventListener("click", () => nudge(1));
    $("#mute-btn").addEventListener("click", () => {
      const current = currentVolume();
      if (!muted && current > 0) { muted = true; lastAudible = current; sendVolume(0, { mutedAction: true }); }
      else { muted = false; sendVolume(lastAudible || 40); }
      syncHome();
    });

    $("#vol-display").addEventListener("click", () => {
      editingVol = true;
      const edit = $("#vol-edit");
      edit.value = String(currentVolume());
      $("#vol-display").style.display = "none";
      edit.style.display = "";
      edit.focus(); edit.select();
    });
    const commitVol = () => {
      if (!editingVol) return;
      if (!state?.speaker?.on) { cancelVolumeEdit(); return; }
      editingVol = false;
      const edit = $("#vol-edit");
      const n = Math.max(0, Math.min(100, parseInt(edit.value, 10) || 0));
      edit.style.display = "none";
      $("#vol-display").style.display = "";
      muted = false;
      sendVolume(n);
      syncHome();
    };
    $("#vol-edit").addEventListener("blur", commitVol);
    $("#vol-edit").addEventListener("keydown", e => {
      if (e.key === "Enter") commitVol();
      if (e.key === "Escape") cancelVolumeEdit();
    });
    $("#vol-edit").addEventListener("input", e => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3);
    });

    $(".input-grid").addEventListener("click", e => {
      const btn = e.target.closest("[data-input]");
      if (!btn || btn.disabled) return;
      localInput = btn.dataset.input;
      inputHoldUntil = Date.now() + 2500;
      bridge.changeInput(localInput).catch(() => {});
      if (state && state.speaker) { state.speaker.input = localInput; syncHome(); }
    });

    $("#setup-speaker").addEventListener("click", () => {
      setPage("settings");
      openSpeakerDialog();
    });

    $("#info-head").addEventListener("click", () => {
      infoOpen = !infoOpen;
      $("#info-grid").classList.toggle("hidden", !infoOpen);
      $("#info-chevron").innerHTML = icon(infoOpen ? "chevronDown" : "chevronRight", 15);
    });
  }

  function finishVolumeDrag(pointerId = null) {
    if (pointerId != null && activeVolumePointer != null && pointerId !== activeVolumePointer) return;
    draggingVol = false;
    activeVolumePointer = null;
  }
  function cancelVolumeEdit() {
    editingVol = false;
    const edit = $("#vol-edit"), display = $("#vol-display");
    if (edit) edit.style.display = "none";
    if (display) display.style.display = "";
  }
  const currentVolume = () => {
    const slider = $("#vol-slider");
    return slider ? +slider.value : Number(state?.speaker?.volume || 0);
  };
  function paintVolume(v) {
    const value = Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
    const slider = $("#vol-slider");
    slider.value = value;
    slider.style.setProperty("--volume", `${value}%`);
    $("#vol-display").textContent = String(value);
    const mute = $("#mute-btn");
    const muteIcon = value <= 0 ? "volumeX" : "volume";
    if (lastMuteIcon !== muteIcon) {
      mute.innerHTML = icon(muteIcon, 19);
      lastMuteIcon = muteIcon;
      mute.querySelector("svg").style.color = value <= 0 ? "var(--danger)" : "";
    }
    mute.title = value <= 0 ? t("unmute") : t("mute");
    $("#mute-note").classList.toggle("hidden", !(muted && value <= 0));
    if (value > 0) lastAudible = value;
    return value;
  }
  function previewVolume(v) {
    const value = paintVolume(v);
    if (state && state.speaker) state.speaker.volume = value;
    volumeHoldUntil = Date.now() + 2500;
    clearTimeout(volumeTimer);
    volumeTimer = setTimeout(() => bridge.setVolume(value).catch(() => {}), 180);
    clearTimeout(volumeToastTimer);
    volumeToastTimer = setTimeout(
      () => toast("info", t("volume_updated", value), "", "volume", 2600, "volume"),
      350,
    );
  }
  function sendVolume(v, { mutedAction = false } = {}) {
    clearTimeout(volumeTimer);
    const value = paintVolume(v);
    if (state && state.speaker) state.speaker.volume = value;
    volumeHoldUntil = Date.now() + 2500;
    bridge.setVolume(value).catch(() => {});
    clearTimeout(volumeToastTimer);
    toast(
      mutedAction ? "warning" : "info",
      mutedAction ? t("muted") : t("volume_updated", value),
      "",
      "volume",
      2600,
      mutedAction ? "mute" : "volume",
    );
  }
  function nudge(delta) {
    muted = false;
    sendVolume(currentVolume() + delta);
  }

  const healthAge = seconds => {
    if (seconds == null) return t("health_none");
    const rounded = Math.max(0, Math.round(Number(seconds) || 0));
    return rounded < 5 ? t("health_now") : t("health_seconds_ago", rounded);
  };
  const healthActionLabel = action => ({
    WAKE: t("wake"), STANDBY: t("standby"), EARLY_STANDBY: t("standby"), ENDSESSION_STANDBY: t("standby"),
  }[action] || String(action || ""));

  function syncHome() {
    if (!state) return;
    const s = state.speaker || {};
    const on = !!s.on;
    const configured = Boolean(s.ip || state?.settings?.device?.kef_ip || state?.settings?.device?.kef_mac);
    $("#dot").className = `dot ${on ? "on" : ""}`;
    $("#dev-name").textContent = s.name || t("no_device");
    const link = s.ip ? (on ? t("connected_on") : t("connected_standby")) : t("disconnected");
    $("#dev-sub").textContent = `${link}${s.ip ? " · " + s.ip : ""}`;

    const pb = $("#power-btn");
    pb.className = `power-switch ${on ? "on" : ""} ${powerPending ? "pending" : ""}`;
    pb.disabled = powerPending || !configured;
    pb.setAttribute("aria-checked", String(on));
    pb.innerHTML = powerPending
      ? `${icon("loader", 14, "spin")}<span>${t(powerPendingTarget ? (powerPendingStage === "confirming" ? "waiting_confirmation" : "waking") : "entering_standby")}</span>`
      : `${icon("power", 14)}<span>${on ? t("power_on") : t("power_standby")}</span>`;

    $("#setup-note").classList.toggle("hidden", configured);
    $("#standby-note").classList.toggle("hidden", !configured || on || powerPendingTarget === true);

    if (!on) {
      finishVolumeDrag();
      cancelVolumeEdit();
    }
    if (!editingVol && !draggingVol && s.volume != null && Date.now() > volumeHoldUntil) {
      if (muted && Number(s.volume) > 0) muted = false;
      paintVolume(s.volume);
    }
    $("#vol-card").classList.toggle("dim", !on);
    $("#input-card").classList.toggle("dim", !on);
    for (const control of [$("#mute-btn"), $("#vol-down"), $("#vol-slider"), $("#vol-up"), $("#vol-display"), $("#vol-edit")]) {
      control.disabled = !on;
    }
    const shownInput = (Date.now() < inputHoldUntil && localInput) ? localInput : s.input;
    for (const btn of $$("[data-input]")) {
      btn.classList.toggle("active", btn.dataset.input === shownInput);
      btn.disabled = !on;
    }

    $("#info-summary").textContent = [s.model, s.firmware].filter(Boolean).join(" · ") || "—";
    const vals = [s.ip, s.mac, s.model, s.firmware];
    vals.forEach((v, i) => { $(`#info-v${i}`).textContent = v || "—"; });
    const health = state.health || {};
    $("#health-poll").textContent = healthAge(health.last_heartbeat_age_s ?? health.last_poll_age_s);
    const action = health.last_action;
    $("#health-action").textContent = action
      ? `${healthActionLabel(action.name)} · ${action.elapsed_ms || 0} ms${action.success ? "" : ` · ${t("failed")}`}`
      : t("health_none");
    const failure = health.last_failure;
    const heartbeatFailure = health.heartbeat_error;
    $("#health-failure").textContent = failure
      ? `${localDetail(failure.detail)} · ${healthAge(failure.age_s)}`
      : heartbeatFailure
        ? `${localDetail(heartbeatFailure)} · ${t("level_warn")} ${health.heartbeat_failures || 1}`
        : t("health_none");
    $("#info-grid").classList.toggle("hidden", !infoOpen);
    $("#info-chevron").innerHTML = icon(infoOpen ? "chevronDown" : "chevronRight", 15);
  }

  // ── 日志页 ──
  function logSkeleton() {
    return `

  function bindLog() {
    $("#log-refresh").addEventListener("click", () => {
      if (!selectedLogFile) bridge.refresh().catch(() => {});
      loadLogs();
    });
    $("#log-file").addEventListener("change", e => {
      selectedLogFile = e.target.value;
      loadLogs();
    });
    $("#log-folder").addEventListener("click", () => bridge.openLogFolder().catch(() => {}));
    $("#log-search").addEventListener("input", e => {
      $("#log-search-clear").classList.toggle("show", !!e.target.value);
      clearTimeout(logSearchTimer);
      logSearchTimer = setTimeout(() => { logQuery = e.target.value; renderLogList(); }, 120);
    });
    $("#log-search-clear").addEventListener("click", () => {
      const input = $("#log-search");
      input.value = "";
      logQuery = "";
      $("#log-search-clear").classList.remove("show");
      renderLogList();
      input.focus();
    });
    $("#severity-track").addEventListener("click", e => {
      const btn = e.target.closest("[data-min-level]");
      if (!btn) return;
      minLogLevel = btn.dataset.minLevel;
      renderLogList();
    });
    $("#log-filter-reset").addEventListener("click", () => {
      logQuery = "";
      minLogLevel = "INFO";
      const input = $("#log-search");
      input.value = "";
      $("#log-search-clear").classList.remove("show");
      renderLogList();
      input.focus();
    });
    const box = $("#log-box");
    box.addEventListener("scroll", () => {
      $("#to-bottom").classList.toggle("show", !isNearBottom(box));
    });
    $("#to-bottom").addEventListener("click", () => {
      box.scrollTop = box.scrollHeight;
      $("#to-bottom").classList.remove("show");
    });
  }

  function parseLog(line) {
    const raw = String(line || "");
    const structured = raw.match(/^\[([^\]]+)\]\[([^\]]+)\]\[([A-Z]+)\]\s*(.*)$/i);
    if (!structured) return null;
    const stamp = structured[1];
    const source = structured[2];
    const original = structured[4];
    const normalizedLevel = { WARNING: "WARN", CRITICAL: "ERROR", FATAL: "ERROR", DEBUG: "INFO" }[(structured?.[3] || "").toUpperCase()];
    const lvl = normalizedLevel || (SEVERITY.includes(structured[3].toUpperCase()) ? structured[3].toUpperCase() : "INFO");
    const message = original;
    return { raw, time: stamp.includes(" ") ? stamp.split(" ").pop() : stamp, source, message, lvl };
  }

  const logMatches = item =>
    SEVERITY.indexOf(item.lvl) >= SEVERITY.indexOf(minLogLevel) &&
    (!logQuery.trim() || item.raw.toLowerCase().includes(logQuery.trim().toLowerCase()));

  function highlightLog(text) {
    const query = logQuery.trim();
    if (!query) return esc(text);
    const safe = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return String(text).split(new RegExp(`(${safe})`, "gi")).map((part, index) =>
      index % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join("");
  }

  function logRowHtml(item) {
    return `<div class="log-line ${item.lvl}">
      <span class="log-time">${esc(item.time || "—")}</span>
      <span class="log-lvl ${item.lvl}">${item.lvl}</span>
      <span class="log-txt">${item.source ? esc(item.source) + " · " : ""}${highlightLog(item.message)}</span>
    </div>`;
  }

  function isNearBottom(box) {
    return box.scrollHeight - box.scrollTop - box.clientHeight < 48;
  }

  function renderLogList({ stickBottom = false } = {}) {
    const box = $("#log-box");
    if (!box) return;
    const keep = stickBottom || isNearBottom(box);
    const visible = logItems.filter(logMatches);
    box.innerHTML = visible.length
      ? visible.map(logRowHtml).join("")
      : `<div class="log-empty">${logQuery.trim() ? t("no_match", logQuery.trim()) : t("no_level")}</div>`;
    if (keep) box.scrollTop = box.scrollHeight;
    syncLogMeta(visible.length);
  }

  function syncLogMeta(visibleCount) {
    const counts = Object.fromEntries(SEVERITY.map(level => [level, 0]));
    for (const item of logItems) counts[item.lvl] = (counts[item.lvl] || 0) + 1;
    for (const level of SEVERITY) {
      const count = level === "INFO" ? logItems.length : counts[level];
      const atOrAbove = SEVERITY.slice(SEVERITY.indexOf(level)).reduce((total, itemLevel) => total + counts[itemLevel], 0);
      const button = $(`[data-min-level="${level}"]`);
      const el = $(`[data-count="${level}"]`);
      if (el) el.textContent = String(count);
      if (button) {
        button.classList.toggle("active", minLogLevel === level);
        button.disabled = count === 0 && level !== "ERROR";
        button.title = t("severity_tip", t(LEVEL_TEXT_KEYS[level]), atOrAbove);
      }
    }
    const foot = $("#log-foot");
    if (foot) {
      const visible = visibleCount ?? logItems.filter(logMatches).length;
      foot.textContent = `${t("showing")} ${visible} / ${logItems.length} ${t("lines")}${minLogLevel !== "INFO" ? ` · ${t("hidden_below", t(LEVEL_TEXT_KEYS[minLogLevel]))}` : ""}`;
    }
    const reset = $("#log-filter-reset");
    if (reset) reset.style.display = logQuery.trim() || minLogLevel !== "INFO" ? "" : "none";
    const box = $("#log-box"), toBottom = $("#to-bottom");
    if (box && toBottom) toBottom.classList.toggle("show", !isNearBottom(box));
  }

  function appendLogLine(line) {
    if (selectedLogFile) return;
    const item = parseLog(line);
    if (!item) return;
    pendingLogItems.push(item);
    if (!logFlushFrame) logFlushFrame = requestAnimationFrame(flushLogLines);
  }

  function flushLogLines() {
    logFlushFrame = 0;
    const pending = pendingLogItems.splice(0);
    if (!pending.length || selectedLogFile) return;
    logItems.push(...pending);
    if (logItems.length > 800) logItems.splice(0, logItems.length - 800);
    const box = $("#log-box");
    if (!box || page !== "log") return;
    const visible = pending.filter(logMatches);
    if (visible.length) {
      const keep = isNearBottom(box);
      const empty = box.querySelector(".log-empty");
      if (empty) empty.remove();
      box.insertAdjacentHTML("beforeend", visible.map(logRowHtml).join(""));
      while (box.children.length > 800) box.firstElementChild.remove();
      if (keep) box.scrollTop = box.scrollHeight;
    }
    syncLogMeta();
  }

  function loadLogs() {
    bridge.logs(selectedLogFile).then(lines => {
      logItems = (lines || []).map(parseLog).filter(Boolean);
      renderLogList({ stickBottom: true });
    }).catch(() => {});
  }

  function syncLogFileSelector() {
    const select = $("#log-file");
    if (!select) return;
    if (selectedLogFile && !logFiles.includes(selectedLogFile)) selectedLogFile = "";
    const currentName = logFiles[0] || "";
    select.innerHTML = `<option value="">${t("today_log")}${currentName ? ` · ${esc(currentName)}` : ""}</option>`
      + logFiles.slice(1).map(name => `<option value="${esc(name)}">${esc(name.replace(/^.*\.(\d{4}-\d{2}-\d{2})$/, "$1"))}</option>`).join("");
    select.value = selectedLogFile;
  }

  function loadLogFiles() {
    return bridge.logFiles().then(files => {
      logFiles = Array.isArray(files) ? files : [];
      syncLogFileSelector();
    }).catch(() => {
      logFiles = [];
      syncLogFileSelector();
    });
  }

          <div style="flex:1">
            <div class="set-label">${t("start_on_login")}</div>
            <div class="set-desc">${t("start_on_login_desc")}</div>
          </div>
          <input id="set-startup-enabled" class="switch" type="checkbox">
        </div>
        <div class="divider"></div>
        <div id="startup-method-row" class="set-row startup-method">
          <div style="flex:1">
            <div class="set-label">${t("startup_method")}</div>
            <div id="startup-method-desc" class="set-desc"></div>
          </div>
          <div id="set-startup-mode" class="startup-segment" role="group" aria-label="${t("startup_method")}">
            <button class="startup-method-btn" data-startup-mode="registry">${t("startup_registry")}</button>
            <button class="startup-method-btn" data-startup-mode="task">${t("startup_task")}</button>
          </div>
        </div>
        <div id="startup-status" class="startup-status"></div>
      </section>`;
  }

  function bindSettings() {
    $(".lang-switch").addEventListener("click", e => {
      const button = e.target.closest("[data-language]");
      if (!button || button.dataset.language === uiLanguage) return;
      const next = button.dataset.language;
      uiLanguage = next;
      if (state?.settings?.general) state.settings.general.ui_language = next;
      document.documentElement.lang = uiLanguage === "en" ? "en" : "zh-CN";
      buildShell();
      syncHome();
      syncSettings();
      setPage(page);
      bridge.updateSettings(JSON.stringify({ ui_language: next })).then(flashSaved).catch(() => {});
    });
    $("#set-input").addEventListener("change", e => {
      bridge.updateSettings(JSON.stringify({ kef_input: e.target.value })).then(flashSaved).catch(() => {});
    });

    $("#pick-btn").addEventListener("click", openSpeakerDialog);

    $(".preset-row").addEventListener("click", e => {
      const preset = e.target.closest("[data-preset]");
      if (preset) {
        bridge.updateSettings(JSON.stringify(PRESETS[preset.dataset.preset].values)).then(flashSaved).catch(() => {});
        return;
      }
      if (e.target.closest("#reset-btn")) {
        bridge.updateSettings(JSON.stringify(PRESETS.recommended.values)).then(flashSaved).catch(() => {});
        return;
      }
      if (e.target.closest("#test-toggle")) {
        testMode = !testMode;
        for (const el of $$(".mx-result")) { el.classList.remove("show"); el.innerHTML = ""; }
        syncSettings();
      }
    });

    $("#matrix").addEventListener("click", e => {
      const check = e.target.closest("[data-rule]");
      if (check) {
        const key = check.dataset.rule;
        bridge.updateSettings(JSON.stringify({ [key]: !ruleOn(key) })).then(flashSaved).catch(() => {});
        return;
      }
      const colBtn = e.target.closest("[data-col]");
      if (colBtn) {
        const col = colBtn.dataset.col;
        const keys = EVENT_ROWS.map(r => r[col]).filter(Boolean);
        const allOn = keys.every(ruleOn);
        bridge.updateSettings(JSON.stringify(Object.fromEntries(keys.map(k => [k, !allOn]))))
          .then(flashSaved).catch(() => {});
        return;
      }
      const testBtn = e.target.closest("[data-test]");
      if (testBtn && !runningTest) {
        runningTest = testBtn.dataset.test;
        syncSettings();
        bridge.runEvent(runningTest).catch(() => { runningTest = null; syncSettings(); });
        return;
      }
      const close = e.target.closest(".mx-result .close");
      if (close) {
        const box = close.closest(".mx-result");
        box.classList.remove("show");
        box.innerHTML = "";
      }
    });

    $("#set-startup-enabled").addEventListener("change", e => {
      pushStartup("registry", e.currentTarget.checked);
    });
    $("#set-startup-mode").addEventListener("click", e => {
      const button = e.target.closest("[data-startup-mode]");
      if (!button || button.disabled) return;
      pushStartup(button.dataset.startupMode, true);
    });
  }

  function startupMode() {
    const requested = (state?.startup || {}).requested_mode;
    if (requested === "task" || requested === "registry") return requested;
    const configured = ((state?.settings || {}).startup || {}).startup_registration_mode;
    return configured === "task" ? "task" : "registry";
  }

  function pushStartup(mode = startupMode(), enabled = $("#set-startup-enabled").checked) {
    bridge.updateStartup(mode, enabled).catch(() => {});
  }

  // ── 选择扬声器弹窗 ──
  const normMac = m => String(m || "").replace(/[^0-9a-fA-F]/g, "").toUpperCase();
  const currentTargetMac = () => normMac(state?.speaker?.mac || state?.settings?.device?.kef_mac);

  function openSpeakerDialog() {
    dlg = { phase: "scanning", found: [], checked: 0, failed: "" };
    dialogReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    $(".shell").inert = true;
    const el = document.createElement("div");
    el.className = "dlg-backdrop";
    el.id = "dlg-backdrop";
    el.innerHTML = `
      <div class="dlg" role="dialog" aria-modal="true" aria-label="${t("select_speaker")}">
        <div class="dlg-head">
          <div class="dlg-head-icon">${icon("optical", 15)}</div>
          <span class="dlg-title">${t("select_speaker")}</span>
          <button class="dlg-x" data-dlg="close" title="${t("close")}" aria-label="${t("close")}">${icon("x", 15)}</button>
        </div>
        <p class="dlg-sub">${t("dlg_sub")}</p>
        <div id="dlg-scan-bar" class="scan-bar"></div>
        <div id="dlg-list" class="dlg-list"></div>
        <button id="dlg-manual-link" class="manual-link">${t("manual_link")}</button>
        <div id="dlg-manual" class="manual-box" style="display:none">
          <div class="manual-title">${t("manual_entry")}</div>
          <div class="manual-row">
            <input id="dlg-ip" class="text-input" placeholder="${t("ip_placeholder")}">
            <input id="dlg-mac" class="text-input" placeholder="${t("mac_placeholder")}">
          </div>
          <div class="manual-actions">
            <button id="dlg-manual-cancel" class="ghost-btn">${t("cancel")}</button>
            <button id="dlg-manual-apply" class="primary-btn" disabled>${t("apply")}</button>
          </div>
        </div>
        <div class="dlg-foot"><button class="ghost-btn" data-dlg="close">${t("close")}</button></div>
      </div>`;
    document.body.append(el);
    const dialog = $(".dlg", el);
    const focusable = () => $$("button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [href], [tabindex]:not([tabindex=\"-1\"])", dialog)
      .filter(node => node.getClientRects().length);
    el.addEventListener("keydown", e => {
      if (e.key !== "Tab") return;
      const items = focusable();
      if (!items.length) { e.preventDefault(); return; }
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    el.addEventListener("click", e => {
      if (e.target === el || e.target.closest("[data-dlg=close]")) { closeSpeakerDialog(); return; }
      const rescan = e.target.closest("#dlg-rescan");
      if (rescan) { startDialogScan(); return; }
      const item = e.target.closest("[data-sp-ip]");
      if (item && !item.classList.contains("current")) {
        bridge.applyTarget(item.dataset.spIp, item.dataset.spMac || "").then(flashSaved).catch(() => {});
        closeSpeakerDialog();
      }
    });
    $("#dlg-manual-link").addEventListener("click", () => {
      $("#dlg-manual-link").style.display = "none";
      $("#dlg-manual").style.display = "";
      $("#dlg-ip").focus();
    });
    $("#dlg-manual-cancel").addEventListener("click", () => {
      $("#dlg-manual").style.display = "none";
      $("#dlg-manual-link").style.display = "";
    });
    $("#dlg-ip").addEventListener("input", () => {
      $("#dlg-manual-apply").disabled = !$("#dlg-ip").value.trim();
    });
    $("#dlg-manual-apply").addEventListener("click", () => {
      const ip = $("#dlg-ip").value.trim();
      if (!ip) return;
      bridge.applyTarget(ip, $("#dlg-mac").value.trim()).then(flashSaved).catch(() => {});
      closeSpeakerDialog();
    });

    $(".dlg-x", el).focus();
    startDialogScan();
  }

  function closeSpeakerDialog() {
    dlg = null;
    const el = $("#dlg-backdrop");
    if (el) el.remove();
    $(".shell").inert = false;
    const returnFocus = dialogReturnFocus;
    dialogReturnFocus = null;
    if (returnFocus && document.contains(returnFocus) && !returnFocus.disabled) returnFocus.focus();
  }

  function startDialogScan() {
    if (!dlg) return;
    dlg.phase = "scanning";
    dlg.found = [];
    dlg.checked = 0;
    dlg.failed = "";
    syncDialog();
    bridge.scanSpeakers().catch(() => {
      if (!dlg) return;
      dlg.phase = "done";
      dlg.failed = t("scan_failed");
      syncDialog();
    });
  }

  function syncDialog() {
    if (!dlg) return;
    const bar = $("#dlg-scan-bar"), list = $("#dlg-list");
    if (!bar || !list) return;

    bar.classList.toggle("failed", !!dlg.failed);
    if (dlg.phase === "scanning") {
      bar.innerHTML = `${icon("loader", 15, "spin")}<span class="scan-text">${t("scanning")}${dlg.checked ? ` · ${t("checked_devices", dlg.checked)}` : ""}</span>`;
    } else if (dlg.failed) {
      bar.innerHTML = `${icon("alert", 15)}<span class="scan-text">${esc(dlg.failed)}</span>
        <button id="dlg-rescan" class="rescan-btn">${icon("refresh", 12)} ${t("rescan")}</button>`;
    } else {
      const hasCurrent = dlg.found.some(d => normMac(d.mac) === currentTargetMac());
      bar.innerHTML = `${icon("check", 15)}<span class="scan-text">${t("scan_complete", dlg.found.length)}${hasCurrent ? t("current_included") : ""}</span>
        <button id="dlg-rescan" class="rescan-btn">${icon("refresh", 12)} ${t("rescan")}</button>`;
    }

    if (dlg.phase === "scanning" && !dlg.found.length) {
      list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
    } else if (dlg.phase === "done" && !dlg.found.length) {
      list.innerHTML = `<div class="dlg-empty">${t("no_speaker")}</div>`;
    } else {
      const cur = currentTargetMac();
      list.innerHTML = dlg.found.map(d => {
        const isCur = cur && normMac(d.mac) === cur;
        return `
        <button class="sp-item ${isCur ? "current" : ""}" data-sp-ip="${esc(d.ip)}" data-sp-mac="${esc(d.mac || "")}">
          <span class="sp-icon">${icon(isCur ? "check" : "optical", 16)}</span>
          <div style="flex:1;min-width:0">
            <div class="sp-name"><span>${esc(d.name || d.model || "KEF")}</span>${isCur ? `<span class="cur-tag">${t("in_use")}</span>` : ""}</div>
            <div class="sp-meta">IP ${esc(d.ip)}${d.mac ? ` · MAC ${esc(d.mac)}` : ""}</div>
          </div>
          ${isCur ? "" : `<span class="sel-hint">${t("select")}</span>`}
        </button>`;
      }).join("") + (dlg.phase === "scanning" ? `<div class="skeleton" style="height:34px"></div>` : "");
    }
  }

  function syncSettings() {
    if (!state) return;
    for (const button of $$("[data-language]")) {
      button.classList.toggle("active", button.dataset.language === uiLanguage);
      button.setAttribute("aria-pressed", String(button.dataset.language === uiLanguage));
    }
    const dev = (state.settings || {}).device || {};
    const sel = $("#set-input");
    if (sel && document.activeElement !== sel) sel.value = dev.kef_input || "";

    const s = state.speaker || {};
    $("#target-name").textContent = s.name || t("no_device");
    $("#target-meta").textContent = [s.mac || dev.kef_mac, s.ip || dev.kef_ip].filter(Boolean).join(" · ") || "—";

    // 矩阵
    for (const check of $$("[data-rule]")) {
      const on = ruleOn(check.dataset.rule);
      check.classList.toggle("on-wake", on && check.dataset.checkcol === "wake");
      check.classList.toggle("on-standby", on && check.dataset.checkcol === "standby");
      check.setAttribute("aria-checked", String(on));
    }
    for (const col of ["wake", "standby"]) {
      const keys = EVENT_ROWS.map(r => r[col]).filter(Boolean);
      const allOn = keys.every(ruleOn);
      const hint = $(`[data-col-hint="${col}"]`);
      if (hint) hint.textContent = allOn ? t("all_off") : t("all_on");
    }
    const enabled = RULE_KEYS.filter(ruleOn).length;
    $("#enabled-count").textContent = t("enabled_rules", enabled, RULE_KEYS.length);

    const active = Object.entries(PRESETS).find(([, p]) =>
      RULE_KEYS.every(k => p.values[k] === ruleOn(k)))?.[0];
    for (const btn of $$("[data-preset]")) btn.classList.toggle("active", btn.dataset.preset === active);
    $("#custom-tag").classList.toggle("hidden", !!active);

    // 模拟模式
    $("#matrix").classList.toggle("testing", testMode);
    $("#test-banner").classList.toggle("hidden", !testMode);
    $("#test-foot").style.display = testMode ? "" : "none";
    const toggle = $("#test-toggle");
    toggle.classList.toggle("on", testMode);
    toggle.innerHTML = `${icon("flask", 13)}<span>${testMode ? t("exit_simulate") : t("simulate_events")}</span>`;
    for (const btn of $$("[data-test]")) {
      const on = ruleOn(btn.dataset.testcol);
      btn.classList.toggle("off", !on);
      btn.title = on ? t("run_once") : t("rule_disabled_simulation");
      btn.disabled = !!runningTest;
      const running = runningTest === btn.dataset.test;
      const iconState = running ? "running" : "idle";
      if (btn.dataset.iconState !== iconState) {
        btn.firstElementChild.outerHTML = running ? icon("loader", 11, "spin") : icon("play", 11);
        btn.dataset.iconState = iconState;
      }
    }

    $("#screen-warn").classList.toggle("hidden",
      !(ruleOn("standby_on_display_off") && !ruleOn("wake_on_display_on")));

    const startupSwitch = $("#set-startup-enabled");
    const startupState = state.startup || {};
    const startupBusy = !!startupState.busy;
    const startupEnabled = startupBusy && typeof startupState.requested_enabled === "boolean"
      ? startupState.requested_enabled
      : !!startupState.registered;
    if (document.activeElement !== startupSwitch) startupSwitch.checked = startupEnabled;
    startupSwitch.disabled = startupBusy;
    const selectedStartupMode = startupMode();
    const methodRow = $("#startup-method-row");
    methodRow.classList.toggle("disabled", !startupEnabled);
    $("#startup-method-desc").textContent = t(selectedStartupMode === "task" ? "startup_task_desc" : "startup_registry_desc");
    for (const button of $$("[data-startup-mode]")) {
      const active = button.dataset.startupMode === selectedStartupMode;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
      button.disabled = !startupEnabled || startupBusy;
    }
    const actualStartupMode = startupState.mode;
    const startupStatus = $("#startup-status");
    const activeStartup = startupEnabled && (actualStartupMode === "task" || actualStartupMode === "registry");
    startupStatus.classList.toggle("active", activeStartup && !startupBusy);
    startupStatus.classList.toggle("busy", startupBusy);
    startupStatus.innerHTML = startupBusy
      ? `${icon("loader", 14, "spin")}<span>${startupEnabled
        ? t("startup_applying", t(selectedStartupMode === "task" ? "startup_task" : "startup_registry"))
        : t("startup_disabling")}</span>`
      : `${icon(activeStartup ? "check" : "info", 14)}<span>${activeStartup
        ? t("startup_active", t(actualStartupMode === "task" ? "startup_task" : "startup_registry"))
        : t("startup_inactive")}</span>`;
  }

  // 模拟事件结果 → 行内结果条
  function showEventResult(msg) {
    if (msg.state !== "running" && runningTest === msg.key) runningTest = null;
    const row = EVENT_ROWS.find(r => r.tests.some(test => test.key === msg.key));
    syncSettings();
    if (!row) return;
    const box = $(`[data-result="${row.id}"]`);
    if (!box) return;
    const test = row.tests.find(test => test.key === msg.key);
    const iconName = { success: "check", warning: "alert", error: "alert", running: "loader" }[msg.state] || "check";
    box.className = `mx-result show ${esc(msg.state)}`;
    box.innerHTML = `
      ${icon(iconName, 14, msg.state === "running" ? "spin" : "")}
      <div style="min-width:0">
        <div><strong>${esc(test ? localized(test.label) : msg.key)}</strong> · ${esc(localTitle(msg.title))} · ${esc(localDetail(msg.detail || ""))}</div>
      </div>
      <button class="close" title="${t("close")}" aria-label="${t("close")}">${icon("x", 13)}</button>`;
  }

  // ═════════════════════════════════════════════════════════
  // 导航与状态应用
  // ═════════════════════════════════════════════════════════
  function setPage(next) {
    if (page === "log" && next !== "log") selectedLogFile = "";
    page = next;
    for (const btn of $$(".nav-btn")) btn.classList.toggle("active", btn.dataset.nav === next);
    for (const id of ["home", "log", "settings"]) {
      $(`#page-${id}`).classList.toggle("hidden", id !== next);
    }
    if (next === "log") {
      loadLogFiles().finally(loadLogs);
    }
    if (next === "home") syncHome();
    if (next === "settings") syncSettings();
  }

  function applyState(next) {
    const json = JSON.stringify(next);
    if (json === lastStateJson) return;
    lastStateJson = json;
    const prevOn = state?.speaker?.on;
    state = next;
    if (powerPending && prevOn !== undefined && state.speaker && state.speaker.on !== prevOn) {
      clearPowerPending();
    }
    // Updating hidden pages for every state event needlessly makes a burst of
    // controller events expensive. The destination page is refreshed once in
    // setPage(), so only repaint the page the user can currently see.
    if (page === "home") syncHome();
    else if (page === "settings") syncSettings();
  }

  const POWER_ACTION_TITLES = new Set(["Wake", "Standby", "Early Standby", "Endsession Standby", "Speaker action failed"]);

  function handleToast(msg) {
    if (msg.kind === "event") { showEventResult(msg); return; }
    if (msg.kind === "scan") {
      if (!dlg) return; // 弹窗已关，静默丢弃
      if (msg.state === "progress") {
        dlg.checked = Math.max(dlg.checked, Number(msg.checked) || 0);
      } else if (msg.state === "candidate" || msg.state === "complete") {
        dlg.found = [...dlg.found, ...(msg.devices || [])]
          .filter((d, i, a) => d.ip && a.findIndex(x => x.ip === d.ip) === i);
        if (msg.state === "complete") dlg.phase = "done";
      } else if (msg.state === "failed") {
        dlg.phase = "done";
        dlg.failed = msg.detail || t("scan_failed");
      }
      syncDialog();
      return;
    }
    const wakeStarted = msg.title === "Speaker action" && /^Wake is running\.$/.test(msg.detail || "");
    const wakeNeedsLiveState = msg.title === "Wake" && msg.level === "success";
    if (powerPending && powerPendingTarget && wakeStarted) {
      powerPendingStage = "confirming";
      syncHome();
    }
    if (powerPending && powerPendingTarget && wakeNeedsLiveState) {
      powerPendingStage = "confirming";
      armPowerPendingTimeout(3000);
      syncHome();
    }
    if (msg.kind === "toast" && POWER_ACTION_TITLES.has(msg.title) && powerPending && !wakeNeedsLiveState) {
      clearPowerPending();
      syncHome();
    }
    toast(msg.level, msg.title, msg.detail);
  }

  // ═════════════════════════════════════════════════════════
  // 启动 + 更新轮询
  // ═════════════════════════════════════════════════════════
  document.querySelector("nav").addEventListener("click", e => {
    const btn = e.target.closest("[data-nav]");
    if (btn) setPage(btn.dataset.nav);
  });

  let updateCursor = 0, polling = false, updateAbort = null, updateRetryTimer = null, updateFailures = 0;
  function setControllerConnectionLost(lost) {
    const note = $("#connection-note");
    if (note) note.classList.toggle("hidden", !lost);
  }
  async function pollUpdates() {
    if (polling || document.hidden) return;
    polling = true;
    const controller = new AbortController();
    let timedOut = false;
    const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, 20000);
    updateAbort = controller;
    try {
      const batch = await bridge.updates(updateCursor, controller.signal);
      updateFailures = 0;
      setControllerConnectionLost(false);
      updateCursor = batch.cursor;
      // A state is a snapshot, so applying every historical one is redundant.
      // Coalesce a batch to its latest state, while preserving all new logs and
      // notifications in order.
      let latestState = null;
      const messages = [];
      const lines = [];
      for (const item of batch.updates) {
        if (item.channel === "state") latestState = item.payload;
        else if (item.channel === "toast") messages.push(item.payload);
        else if (item.channel === "log") lines.push(item.payload);
      }
      if (latestState) applyState(JSON.parse(latestState));
      for (const payload of messages) handleToast(JSON.parse(payload));
      for (const line of lines) appendLogLine(line);
    } catch (error) {
      if (error.name !== "AbortError" || timedOut) {
        updateFailures += 1;
        if (updateFailures >= 3) setControllerConnectionLost(true);
        updateRetryTimer = setTimeout(() => {
          updateRetryTimer = null;
          pollUpdates();
        }, 1000);
      }
    } finally {
      clearTimeout(timeout);
      if (updateAbort === controller) updateAbort = null;
      polling = false;
      if (!document.hidden && !updateRetryTimer) pollUpdates();
    }
  }
  function updatePollingVisibility() {
    if (document.hidden) {
      if (updateAbort) updateAbort.abort();
      clearTimeout(updateRetryTimer);
      updateRetryTimer = null;
      return;
    }
    pollUpdates();
  }

  bridge.bootstrap().then(boot => {
    state = boot.state;
    updateCursor = Number(boot.cursor) || 0;
    uiLanguage = state?.settings?.general?.ui_language === "en" ? "en" : "zh";
    document.documentElement.lang = uiLanguage === "en" ? "en" : "zh-CN";
    lastStateJson = JSON.stringify(state);
    buildShell();
    syncHome();
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && dlg) closeSpeakerDialog();
    });
    document.addEventListener("visibilitychange", updatePollingVisibility);
    updatePollingVisibility();
  }).catch(() => {
    $("#main").innerHTML = `<div class="boot-error"><h1>${t("controller_unavailable")}</h1><p>${t("controller_unavailable_desc")}</p></div>`;
  });
  </script>
</body>
</html>
