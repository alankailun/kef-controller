<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEF Controller</title>
  <style>
    :root {
      color-scheme: light dark;
      --teal: #0d9488; --teal-ink: #0f766e; --teal-soft: #f0fdfa;
      --bg: #f3f3f3; --panel: #ffffff; --panel-flat: #fafafa; --panel-alt: #fcfcfc;
      --line: #e5e5e5; --line-soft: #f0f0f0; --line-faint: #f5f5f5;
      --ink: #1a1a1a; --muted: #616161; --faint: #8a8a8a; --ghost: #a0a0a0; --hair: #c4c4c4;
      --btn-line: #d1d1d1; --btn-line-soft: #e0e0e0;
      --danger: #dc2626;
      --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-ink: #92400e;
      --test: #6d28d9; --test-bg: #f5f3ff; --test-line: #ddd6fe;
      --ok-bg: #f0fdfa; --ok-ink: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --teal-soft: #10322e;
        --bg: #202324; --panel: #2b2f30; --panel-flat: #272b2c; --panel-alt: #2e3233;
        --line: rgba(255,255,255,.12); --line-soft: rgba(255,255,255,.08); --line-faint: rgba(255,255,255,.05);
        --ink: #f1f4f3; --muted: #b7c0be; --faint: #93a09d; --ghost: #7d8a87; --hair: #5a6663;
        --btn-line: rgba(255,255,255,.22); --btn-line-soft: rgba(255,255,255,.14);
        --warn-bg: #372a10; --warn-line: #6b5518; --warn-ink: #fcd34d;
        --test: #c4b5fd; --test-bg: #2e2450; --test-line: #4c3d85;
        --ok-bg: #123430; --ok-ink: #5eead4;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; min-width: 620px; background: var(--bg); color: var(--ink);
      font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .shell { display: flex; height: 100vh; }
    nav { width: 148px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 6px 12px; }
    .nav-btn {
      position: relative; display: flex; align-items: center; gap: 11px; padding: 10px 12px;
      border: 0; background: transparent; border-radius: 6px; font-size: 13.5px; text-align: left;
    }
    .nav-btn:hover { background: rgba(127,127,127,.10); }
    .nav-btn.active { background: rgba(127,127,127,.16); font-weight: 600; }
    .nav-btn.active::before {
      content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 16px; border-radius: 2px; background: var(--teal);
    }
    .nav-spacer { flex: 1; }
    main {
      flex: 1; min-width: 0; background: var(--panel); overflow-y: auto;
      border: 1px solid var(--line); border-right: 0; border-bottom: 0; border-top-left-radius: 8px;
    }
    .page { padding: 24px 28px 32px; max-width: 720px; }
    .page.hidden { display: none; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; flex: 1; }
    .page-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }

    /* ── 状态条 ── */
    .status-bar {
      display: flex; align-items: center; gap: 12px; padding: 13px 16px; margin-bottom: 14px;
      background: var(--panel-flat); border: 1px solid var(--line); border-radius: 10px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: #94a3b8; }
    .dot.on { background: #10b981; }
    .status-name { font-size: 14px; font-weight: 600; }
    .status-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
    .power-switch {
      margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 8px 16px; flex-shrink: 0;
      border: 1px solid var(--btn-line); background: var(--panel); border-radius: 7px;
      font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .power-switch.on { background: var(--teal); border-color: var(--teal); color: #fff; }
    .power-switch.pending { opacity: .65; cursor: wait; }

    /* ── 卡片 ── */
    .card { padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
    .card.dim { opacity: .45; pointer-events: none; }
    .card-label { font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }

    /* ── 音量 ── */
    .vol-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .vol-display {
      border: 0; background: transparent; font-size: 32px; font-weight: 700; padding: 0; line-height: 1;
      font-variant-numeric: tabular-nums; cursor: text;
    }
    .vol-edit {
      width: 66px; border: 1.5px solid var(--teal); border-radius: 6px; font-size: 26px; font-weight: 700;
      text-align: right; padding: 2px 6px; outline: none; font-variant-numeric: tabular-nums; background: var(--panel);
    }
    .vol-row { display: flex; align-items: center; gap: 10px; }
    .vol-icon-btn {
      width: 36px; height: 36px; border: 1px solid var(--btn-line-soft); background: var(--panel);
      border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nudge-btn {
      width: 30px; height: 30px; border: 1px solid var(--btn-line-soft); background: var(--panel);
      border-radius: 7px; color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nudge-btn:hover:not(:disabled), .vol-icon-btn:hover:not(:disabled) { border-color: var(--teal); }
    .slider-wrap { flex: 1; min-width: 0; }
    .slider { --volume: 0%; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; }
    .slider::-webkit-slider-runnable-track {
      height: 6px; border-radius: 999px; transition: box-shadow .2s ease;
      background: linear-gradient(to right, var(--teal) 0, var(--teal) var(--volume), rgba(127,127,127,.25) var(--volume));
    }
    .slider::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px; margin-top: -6px; border: 0; border-radius: 50%;
      background: var(--teal); box-shadow: 0 1px 2px rgba(0,0,0,.2);
      transition: box-shadow .18s ease, transform .12s ease;
    }
    .slider:hover:not(:disabled)::-webkit-slider-thumb {
      box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 0 0 5px rgba(13,148,136,.16);
    }
    .slider:active:not(:disabled)::-webkit-slider-thumb {
      transform: scale(1.15);
      box-shadow: 0 1px 3px rgba(0,0,0,.25), 0 0 0 8px rgba(13,148,136,.20), 0 0 16px rgba(13,148,136,.60);
    }
    .slider:active:not(:disabled)::-webkit-slider-runnable-track { box-shadow: 0 0 10px rgba(13,148,136,.30); }
    .slider:focus-visible::-webkit-slider-thumb { outline: 3px solid rgba(13,148,136,.25); outline-offset: 2px; }
    .ticks { display: flex; justify-content: space-between; margin-top: 4px; }
    .ticks span { font-size: 10px; color: var(--hair); font-variant-numeric: tabular-nums; }
    .mute-note { display: flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 12px; color: var(--danger); }
    .mute-note.hidden { display: none; }

    /* ── 输入源 ── */
    .input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 10px; }
    .input-btn {
      display: flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 8px;
      border: 1px solid var(--btn-line-soft); background: var(--panel); border-radius: 8px; font-size: 13px;
    }
    .input-btn:hover:not(:disabled) { border-color: var(--teal); }
    .input-btn.active {
      border-color: var(--teal); background: var(--teal-soft); color: var(--teal-ink);
      font-weight: 600; box-shadow: inset 0 0 0 1px var(--teal);
    }

    /* ── 设备信息（折叠） ── */
    .card-flat { background: var(--panel-flat); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .info-head {
      width: 100%; display: flex; align-items: center; gap: 8px; padding: 11px 14px;
      border: 0; background: transparent; color: var(--muted); text-align: left;
    }
    .info-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .info-summary { margin-left: auto; font-size: 12px; color: var(--ghost); }
    .info-grid { margin: 0; padding: 0 14px 14px 36px; }
    .info-grid.hidden { display: none; }
    .info-row { display: flex; padding: 5px 0; border-top: 1px solid var(--line-soft); }
    .info-row dt { width: 96px; font-size: 12.5px; color: var(--faint); margin: 0; flex-shrink: 0; }
    .info-row dd { font-size: 12.5px; margin: 0; font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }

    /* ── 日志 ── */
    .ghost-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 13px;
      border: 1px solid var(--btn-line); background: var(--panel); border-radius: 6px; font-size: 13px;
    }
    .ghost-btn:hover { border-color: var(--faint); }
    .search-box {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 8px;
      border: 1px solid var(--btn-line); background: var(--panel); border-radius: 7px; color: var(--faint);
    }
    .search-box:focus-within { border-color: var(--teal); }
    .search-box input { flex: 1; border: 0; outline: none; font-size: 13.5px; background: transparent; color: var(--ink); }
    .lvl-filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .lvl-btn {
      padding: 4px 10px; border: 1px solid var(--btn-line-soft); background: var(--panel); border-radius: 999px;
      font: 600 11.5px ui-monospace, Consolas, monospace; color: var(--ghost);
    }
    .lvl-btn.active.ERROR { color: #fca5a5; border-color: #7f1d1d; background: #450a0a; }
    .lvl-btn.active.WARN  { color: #fcd34d; border-color: #78350f; background: #451a03; }
    .lvl-btn.active.EVENT { color: #c4b5fd; border-color: #4c1d95; background: #2e1065; }
    .lvl-btn.active.STATE { color: #67e8f9; border-color: #155e75; background: #083344; }
    .lvl-btn.active.STEP  { color: #86efac; border-color: #14532d; background: #052e16; }
    .lvl-btn.active.INFO  { color: #cbd5e1; border-color: #334155; background: #1e293b; }
    .log-box {
      background: #0f172a; border-radius: 10px; padding: 12px; height: calc(100vh - 262px); min-height: 320px;
      overflow-y: auto; font: 12px/1.65 ui-monospace, "Cascadia Mono", Consolas, monospace;
      overscroll-behavior: contain; scrollbar-color: #475569 transparent;
    }
    .log-line { display: flex; gap: 8px; padding: 3px 6px; border-radius: 4px; align-items: flex-start; }
    .log-line.ERROR { background: rgba(220,38,38,.15); box-shadow: inset 2px 0 0 #dc2626; }
    .log-line.WARN { background: rgba(217,119,6,.12); box-shadow: inset 2px 0 0 #d97706; }
    .log-time { color: #64748b; flex-shrink: 0; }
    .log-lvl {
      flex-shrink: 0; width: 48px; text-align: center; border-radius: 3px;
      font-size: 10px; font-weight: 700; padding: 1px 0; border: 1px solid;
    }
    .log-lvl.ERROR { color: #fca5a5; border-color: #7f1d1d; background: #450a0a; }
    .log-lvl.WARN  { color: #fcd34d; border-color: #78350f; background: #451a03; }
    .log-lvl.EVENT { color: #c4b5fd; border-color: #4c1d95; background: #2e1065; }
    .log-lvl.STATE { color: #67e8f9; border-color: #155e75; background: #083344; }
    .log-lvl.STEP  { color: #86efac; border-color: #14532d; background: #052e16; }
    .log-lvl.INFO  { color: #cbd5e1; border-color: #334155; background: #1e293b; }
    .log-txt { color: #cbd5e1; word-break: break-all; white-space: pre-wrap; }
    .log-empty { padding: 30px; text-align: center; color: #475569; }
    .log-foot { margin: 8px 2px 0; font-size: 12px; color: var(--ghost); }

    /* ── 设置 ── */
    .saved-flash {
      display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600;
      color: var(--teal-ink); background: var(--teal-soft); border-radius: 999px; padding: 4px 10px;
    }
    .saved-flash.hidden { display: none; }
    .sec-title { margin: 18px 0 10px; font-size: 16px; font-weight: 600; }
    .sec-desc { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
    .set-row { display: flex; align-items: center; gap: 14px; }
    .set-label { font-size: 14px; font-weight: 600; }
    .set-desc { font-size: 12px; color: var(--faint); margin-top: 2px; }
    .divider { height: 1px; background: var(--line-soft); margin: 14px 0; }
    select, .text-input {
      padding: 7px 10px; border: 1px solid var(--btn-line); border-radius: 6px; font-size: 13.5px;
      background: var(--panel); min-width: 130px; outline: none;
    }
    select:focus, .text-input:focus { border-color: var(--teal); }
    .text-input { font-family: ui-monospace, Consolas, monospace; }
    .target-val { text-align: right; }
    .target-ip { font-size: 11.5px; color: var(--ghost); font-family: ui-monospace, Consolas, monospace; margin-top: 2px; }
    .primary-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 15px; border: 0; flex-shrink: 0;
      background: var(--teal); color: #fff; border-radius: 6px; font-size: 13px; font-weight: 600;
    }
    .primary-btn:hover:not(:disabled) { background: #0b7f74; }
    .primary-btn:disabled { opacity: .6; }
    /* ── 选择扬声器弹窗 ── */
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes pop-in { from { opacity: 0; transform: scale(.97) translateY(6px); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .dlg-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      animation: fade-in .15s ease;
    }
    .dlg {
      width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.30); padding: 18px 20px 16px;
      animation: pop-in .16s ease; display: flex; flex-direction: column; max-height: calc(100vh - 48px); overflow-y: auto;
    }
    .dlg-head { display: flex; align-items: center; gap: 9px; }
    .dlg-head-icon {
      width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--panel);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .dlg-title { font-size: 17px; font-weight: 600; }
    .dlg-x {
      margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent;
      border-radius: 6px; color: var(--faint); display: flex; align-items: center; justify-content: center;
    }
    .dlg-x:hover { background: rgba(127,127,127,.12); color: var(--ink); }
    .dlg-sub { margin: 8px 0 14px; font-size: 13px; color: var(--muted); }
    .scan-bar {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin-bottom: 10px;
      background: var(--teal-soft); border: 1px solid rgba(13,148,136,.28); border-radius: 8px;
    }
    .scan-bar.failed { background: var(--warn-bg); border-color: var(--warn-line); }
    .scan-bar.failed .scan-text { color: var(--warn-ink); }
    .scan-text { font-size: 12.5px; color: var(--teal-ink); flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
    .rescan-btn {
      display: flex; align-items: center; gap: 4px; padding: 4px 10px; flex-shrink: 0;
      border: 1px solid rgba(13,148,136,.4); background: var(--panel); border-radius: 6px;
      font-size: 12px; color: var(--teal-ink); font-weight: 600;
    }
    .rescan-btn:hover { border-color: var(--teal); }
    .dlg-list { display: flex; flex-direction: column; gap: 7px; min-height: 68px; }
    .skeleton {
      height: 60px; border-radius: 9px; background-size: 200% 100%; animation: shimmer 1.3s infinite;
      background-image: linear-gradient(90deg, rgba(127,127,127,.10) 25%, rgba(127,127,127,.22) 50%, rgba(127,127,127,.10) 75%);
    }
    .sp-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left;
      border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
    }
    .sp-item:hover { border-color: var(--teal); }
    .sp-item.current { border-color: var(--teal); background: var(--teal-soft); box-shadow: inset 0 0 0 1px var(--teal); cursor: default; }
    .sp-icon {
      width: 34px; height: 34px; border-radius: 8px; background: rgba(127,127,127,.12); color: var(--muted);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sp-item.current .sp-icon { background: var(--teal); color: #fff; }
    .sp-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cur-tag { font-size: 10.5px; font-weight: 700; color: var(--teal-ink); background: rgba(13,148,136,.16); border-radius: 5px; padding: 1px 7px; flex-shrink: 0; }
    .sp-meta { font-size: 11.5px; color: var(--faint); margin-top: 2px; font-family: ui-monospace, Consolas, monospace; }
    .sel-hint { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--teal); flex-shrink: 0; }
    .dlg-empty { padding: 24px; text-align: center; color: var(--ghost); font-size: 13px; }
    .manual-link {
      align-self: flex-start; margin-top: 12px; border: 0; background: transparent;
      color: var(--teal); font-size: 13px; padding: 4px 0; font-weight: 500;
    }
    .manual-link:hover { text-decoration: underline; }
    .manual-box { margin-top: 12px; padding: 13px; background: var(--panel-flat); border: 1px solid var(--line); border-radius: 9px; }
    .manual-title { font-size: 12.5px; font-weight: 600; margin-bottom: 9px; }
    .manual-row { display: flex; gap: 8px; }
    .manual-row .text-input { flex: 1; min-width: 0; width: auto; }
    .manual-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .dlg-foot { display: flex; justify-content: flex-end; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line-soft); }

    /* ── 日志辅助控件 ── */
    .search-box { position: relative; }
    .search-clear {
      border: 0; background: transparent; color: var(--faint); display: none;
      width: 22px; height: 22px; border-radius: 5px; padding: 0; flex-shrink: 0;
      align-items: center; justify-content: center;
    }
    .search-clear.show { display: flex; }
    .search-clear:hover { background: rgba(127,127,127,.14); color: var(--ink); }
    .lvl-link { border: 0; background: transparent; color: var(--teal); font-size: 12px; font-weight: 600; padding: 4px 6px; }
    .lvl-link:hover { text-decoration: underline; }
    .log-wrap { position: relative; }
    .to-bottom {
      position: absolute; right: 14px; bottom: 12px; display: none; align-items: center; gap: 5px;
      padding: 6px 12px; border: 1px solid #334155; background: #1e293b; color: #cbd5e1;
      border-radius: 999px; font-size: 12px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.4);
    }
    .to-bottom.show { display: flex; }
    .to-bottom:hover { border-color: #64748b; }

    .preset-row { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; flex-wrap: wrap; }
    .preset-label { font-size: 13px; color: var(--muted); }
    .preset-btn { padding: 6px 15px; border: 1px solid var(--btn-line); background: var(--panel); border-radius: 6px; font-size: 13px; }
    .preset-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
    .custom-tag { font-size: 11.5px; color: var(--faint); background: rgba(127,127,127,.15); border-radius: 5px; padding: 3px 8px; }
    .custom-tag.hidden { display: none; }
    .test-toggle {
      margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 13px;
      border: 1px solid var(--btn-line); background: var(--panel); border-radius: 6px; font-size: 13px; color: var(--muted);
    }
    .test-toggle.on { border-color: #7c3aed; background: var(--test-bg); color: var(--test); font-weight: 600; }
    .reset-btn {
      width: 30px; height: 30px; border: 1px solid var(--btn-line); background: var(--panel);
      border-radius: 6px; color: var(--muted); display: flex; align-items: center; justify-content: center;
    }
    .test-banner {
      display: flex; gap: 8px; margin: 0 0 11px; padding: 10px 13px; background: var(--test-bg);
      border: 1px solid var(--test-line); border-radius: 8px; font-size: 12.5px; color: var(--test); line-height: 1.6;
    }
    .test-banner.hidden { display: none; }

    .matrix { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .mx-head { display: grid; border-bottom: 1px solid var(--line); background: var(--panel-flat); }
    .mx-row { display: grid; border-bottom: 1px solid var(--line-soft); }
    .mx-row:last-of-type { border-bottom: 0; }
    .mx-row.alt { background: var(--panel-alt); }
    .matrix, .mx-head, .mx-row { --grid: 1fr 106px 106px; }
    .matrix.testing .mx-head, .matrix.testing .mx-row { --grid: 1fr 88px 88px 172px; }
    .mx-head, .mx-row { grid-template-columns: var(--grid); }
    .th-event {
      padding: 11px 16px; font-size: 11.5px; font-weight: 600; color: var(--faint);
      text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center;
    }
    .th-col {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      padding: 8px; border: 0; border-left: 1px solid var(--line-soft); background: transparent;
    }
    .th-col-title { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; }
    .th-col-hint { font-size: 10px; color: var(--ghost); }
    .td-event { display: flex; align-items: center; gap: 11px; padding: 12px 16px; min-width: 0; }
    .ev-icon { color: var(--muted); flex-shrink: 0; }
    .ev-label { font-size: 13.5px; font-weight: 600; }
    .ev-desc { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
    .td-cell { display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--line-faint); }
    .check {
      width: 23px; height: 23px; border-radius: 6px; border: 1.5px solid var(--hair);
      background: var(--panel); color: #fff; padding: 0; display: flex; align-items: center; justify-content: center;
    }
    .check.on-wake { background: var(--teal); border-color: var(--teal); }
    .check.on-standby { background: #525252; border-color: #525252; }
    .check svg { visibility: hidden; }
    .check.on-wake svg, .check.on-standby svg { visibility: visible; }
    .na { color: var(--btn-line-soft); display: flex; }
    .td-test { display: none; align-items: center; justify-content: center; gap: 5px; border-left: 1px solid var(--line-faint); padding: 6px 8px; flex-wrap: wrap; }
    .matrix.testing .td-test { display: flex; }
    .test-btn {
      display: flex; align-items: center; gap: 4px; padding: 5px 10px; white-space: nowrap;
      border: 1px solid var(--test-line); background: var(--test-bg); border-radius: 6px;
      font-size: 12px; font-weight: 600; color: var(--test);
    }
    .test-btn.off { border-color: var(--btn-line-soft); background: var(--panel-flat); color: var(--ghost); font-weight: 400; }
    .mx-result {
      display: none; gap: 8px; padding: 10px 16px; font-size: 12.5px; line-height: 1.6;
      border-bottom: 1px solid var(--line-soft); align-items: flex-start;
    }
    .matrix.testing .mx-result.show { display: flex; }
    .mx-result.success { background: var(--ok-bg); color: var(--ok-ink); }
    .mx-result.warning { background: var(--warn-bg); color: var(--warn-ink); }
    .mx-result.error { background: var(--warn-bg); color: var(--danger); }
    .mx-result.running { background: var(--test-bg); color: var(--test); }
    .mx-result .detail { font-size: 11px; opacity: .75; margin-top: 2px; font-family: ui-monospace, Consolas, monospace; }
    .mx-result .close {
      margin-left: auto; border: 0; background: transparent; color: inherit; opacity: .4;
      font-size: 12px; flex-shrink: 0; padding: 2px;
    }
    .warn-note {
      display: flex; gap: 8px; margin-top: 11px; padding: 10px 13px; background: var(--warn-bg);
      border: 1px solid var(--warn-line); border-radius: 8px; font-size: 12.5px; color: var(--warn-ink); line-height: 1.6;
    }
    .warn-note.hidden { display: none; }
    .table-foot { margin: 10px 2px 0; font-size: 11.5px; color: var(--ghost); line-height: 1.6; }

    .switch { width: 38px; height: 22px; appearance: none; background: #aeb8bc; border-radius: 999px; position: relative; cursor: pointer; transition: .18s; flex-shrink: 0; margin: 0; }
    .switch:checked { background: var(--teal); }
    .switch::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: #fff; position: absolute; left: 3px; top: 3px; transition: .18s; }
    .switch:checked::before { left: 19px; }

    /* ── Toast ── */
    .toast-area { position: fixed; z-index: 9; top: 18px; right: 22px; display: grid; gap: 8px; width: min(340px, calc(100vw - 44px)); }
    .toast {
      padding: 11px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
      box-shadow: 0 12px 34px rgba(0,0,0,.16); font-size: 12.5px;
    }
    .toast b { display: block; margin-bottom: 2px; font-size: 13px; }
    .toast small { color: var(--faint); }
    .toast.success { border-left: 3px solid #10b981; }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.warning { border-left: 3px solid #d97706; }
    .toast.info { border-left: 3px solid var(--teal); }

    .boot-error { padding: 40px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <nav>
      <button class="nav-btn active" data-nav="home"></button>
      <button class="nav-btn" data-nav="log"></button>
      <div class="nav-spacer"></div>
      <button class="nav-btn" data-nav="settings"></button>
    </nav>
    <main id="main"></main>
  </div>
  <div id="toasts" class="toast-area"></div>

  <script>
  "use strict";
  // ═════════════════════════════════════════════════════════
  // 常量与工具
  // ═════════════════════════════════════════════════════════
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
  const esc = s => String(s ?? "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c]));

  const ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/>',
    log: '<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/><path d="M8.5 12.5h7m-7 4h7"/>',
    settings: '<circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.6m0 13.2v2.6M4.9 4.9l1.9 1.9m10.4 10.4 1.9 1.9M2.8 12h2.6m13.2 0h2.6M4.9 19.1l1.9-1.9M17.2 6.8l1.9-1.9"/>',
    power: '<path d="M12 2v10"/><path d="M7.2 5.8a8 8 0 1 0 9.6 0"/>',
    play: '<path d="M7 4.5v15l12-7.5z"/>',
    monitor: '<rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8m-4-4v4"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    unlock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.7-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>',
    laptop: '<rect x="4.5" y="5" width="15" height="10.5" rx="1.5"/><path d="M2 19h20"/>',
    monitorOff: '<rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8m-4-4v4"/><path d="m5.5 6.5 13 8"/>',
    flask: '<path d="M9.5 3h5M10 3v6l-5.2 8.7A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-3.3L14 9V3"/><path d="M7.6 15h8.8"/>',
    chevronRight: '<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>',
    chevronDown: '<path d="m6.5 9.5 5.5 5.5 5.5-5.5"/>',
    check: '<path d="m5 12.5 5 5 9-10.5"/>',
    minus: '<path d="M6 12h12"/>',
    plus: '<path d="M12 6v12M6 12h12"/>',
    x: '<path d="m6 6 12 12M18 6 6 18"/>',
    volume: '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>',
    volumeX: '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6m0-6-5 6"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.6-4.6"/>',
    refresh: '<path d="M20 6v5h-5"/><path d="M19 11a7.5 7.5 0 1 0 .2 4"/>',
    folder: '<path d="M3 7.5h6l2 2h10v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9.5V6a2 2 0 0 1 2-2h4l2 2h5"/>',
    rotateCcw: '<path d="M3 3v5h5"/><path d="M3.5 8A9 9 0 1 1 3 12"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4.5m0 3.2v.1"/>',
    loader: '<path d="M12 3a9 9 0 1 1-9 9"/>',
    wifi: '<path d="M3.5 9a13 13 0 0 1 17 0"/><path d="M6.5 12.5a8.5 8.5 0 0 1 11 0"/><path d="M9.7 16a3.5 3.5 0 0 1 4.6 0"/><circle cx="12" cy="19" r=".7" fill="currentColor" stroke="none"/>',
    bluetooth: '<path d="m8 7 8 10V3L8 13l8 8V7z"/>',
    tv: '<rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8m-4-4v4"/>',
    optical: '<circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4m8.4-8.4a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14m14-14a10 10 0 0 1 0 14"/>',
    coaxial: '<path d="M8 3v5a4 4 0 0 0 8 0V3M6 3h4v4H6zm8 0h4v4h-4zM12 12v9m0-4h6v4"/>',
    analog: '<path d="M7 5v14m10-14v14M3 9h4m10 6h4"/><circle cx="3" cy="9" r="1.5"/><circle cx="21" cy="15" r="1.5"/>',
    usb: '<path d="M12 3v13m0-10 4 4m-4 2-4 4m4 0a3 3 0 1 0 3 3"/><path d="m16 6-1-2h2z"/><circle cx="8" cy="16" r="1.3"/>',
  };
  const icon = (name, size = 15, cls = "") =>
    `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;

  const INPUT_META = {
    wifi: "Wi-Fi", bluetooth: "蓝牙", tv: "TV (HDMI)", optical: "光纤",
    coaxial: "同轴", analog: "模拟", usb: "USB",
  };
  const INPUT_ORDER = ["wifi", "bluetooth", "tv", "optical", "coaxial", "analog", "usb"];
  const inputLabel = v => INPUT_META[v] || v;

  // 电源行为矩阵：每行对应后端 config 字段与可模拟的事件
  const EVENT_ROWS = [
    { id: "app_start", label: "App 启动", desc: "打开 KEF Controller 时", icon: "play",
      wake: "wake_on_startup", standby: null,
      tests: [{ key: "startup", label: "启动", col: "wake" }] },
    { id: "screen", label: "屏幕开关", desc: "显示器点亮 / 熄灭时", icon: "monitor",
      wake: "wake_on_display_on", standby: "standby_on_display_off",
      tests: [{ key: "display-off", label: "熄屏", col: "standby" }, { key: "display-on", label: "亮屏", col: "wake" }] },
    { id: "lock", label: "Windows 锁屏", desc: "锁定 / 解锁时", icon: "lock",
      wake: "wake_on_unlock_only", standby: "standby_on_lock",
      tests: [{ key: "lock", label: "锁定", col: "standby" }, { key: "unlock", label: "解锁", col: "wake" }] },
    { id: "sleep", label: "Windows 睡眠", desc: "进入睡眠时", icon: "moon",
      wake: null, standby: "standby_on_sleep",
      tests: [{ key: "sleep", label: "睡眠", col: "standby" }] },
    { id: "lid", label: "笔记本合盖", desc: "合上笔记本盖子时", icon: "laptop",
      wake: null, standby: "standby_on_lid_close", tests: [] },
    { id: "shutdown", label: "Windows 关机", desc: "关机或注销时", icon: "power",
      wake: null, standby: "endsession_standby_on_shutdown",
      tests: [{ key: "shutdown", label: "关机", col: "standby" }] },
  ];
  const RULE_KEYS = EVENT_ROWS.flatMap(r => [r.wake, r.standby]).filter(Boolean);
  const PRESETS = {
    recommended: { label: "推荐", desc: "跟随电脑状态自动开关",
      values: Object.fromEntries(RULE_KEYS.map(k => [k, true])) },
    conservative: { label: "保守", desc: "只在睡眠、合盖和关机时待机",
      values: Object.fromEntries(RULE_KEYS.map(k =>
        [k, ["standby_on_sleep", "standby_on_lid_close", "endsession_standby_on_shutdown"].includes(k)])) },
    manual: { label: "手动", desc: "全部关闭，只手动控制",
      values: Object.fromEntries(RULE_KEYS.map(k => [k, false])) },
  };

  const TOAST_ZH = {
    "Controller error": "控制器错误", "Volume updated": "音量已更新", "Volume update failed": "音量更新失败",
    "Input changed": "输入源已切换", "Input change failed": "输入源切换失败", "Invalid input": "无效的输入源",
    "Settings were not saved": "设置未保存", "Settings saved": "设置已保存",
    "Settings updated for this session": "设置已在本次会话生效",
    "Target not saved": "目标未保存", "Target saved": "目标已保存",
    "Target updated for this session": "目标已在本次会话生效",
    "Startup settings saved": "开机自启设置已保存", "Startup settings need attention": "开机自启设置需要处理",
    "Scanning for speakers": "正在扫描扬声器", "Speaker scan complete": "扫描完成", "Speaker scan failed": "扫描失败",
    "Speaker action": "扬声器操作", "Speaker action failed": "扬声器操作失败",
    "Wake": "唤醒", "Standby": "待机", "Early Standby": "提前待机", "Endsession Standby": "关机待机",
    "Unknown test": "未知的模拟事件",
    "Running": "执行中", "Completed": "已完成", "No action": "无动作", "Failed": "失败",
  };
  const DETAIL_ZH = [
    [/^Searching the local network…$/, "正在搜索本地网络…"],
    [/^Found (\d+) supported speaker\(s\)\.$/, "找到 $1 台受支持的扬声器。"],
    [/^No supported speakers were found\.$/, "未找到受支持的扬声器。"],
    [/^Changes are now active\.$/, "更改已生效。"],
    [/^Volume is now (\d+)\.$/, "音量已设为 $1。"],
    [/^Switched to (\S+)\.$/, "已切换到 $1。"],
    [/^Verified ([\d.]+) and saved the target\.$/, "已验证 $1 并保存目标。"],
    [/^Recovered ([\d.]+) from the MAC address and saved it\.$/, "已通过 MAC 找回 $1 并保存。"],
    [/^Saved the target, but the speaker did not report its MAC during verification\.$/, "目标已保存，但验证时扬声器未报告 MAC。"],
    [/^Saved the MAC target\. The app will recover its IP when the speaker appears\.$/, "已保存 MAC 目标，扬声器上线后会自动找回 IP。"],
    [/^Saved the target as a connection hint; it is not reachable right now\.$/, "已保存为连接提示；当前无法访问该地址。"],
    [/^That IP responded, but is not a supported KEF speaker\.$/, "该 IP 有响应，但不是受支持的 KEF 扬声器。"],
    [/^That IP belongs to a speaker with MAC (.+)\.$/, "该 IP 属于 MAC 为 $1 的扬声器。"],
    [/^Enter a routable IPv4 address\.$/, "请输入有效的 IPv4 地址。"],
    [/^Enter a 12-digit MAC address\.$/, "请输入 12 位 MAC 地址。"],
    [/^Enter an IP address or MAC address\.$/, "请输入 IP 或 MAC 地址。"],
    [/^The target details could not be validated\.$/, "无法验证目标信息。"],
    [/^Windows startup registration is up to date\.$/, "Windows 开机自启注册已更新。"],
    [/^Wake requested$/, "已请求唤醒"], [/^Standby requested$/, "已请求待机"],
    [/^Wake is running\.$/, "正在唤醒扬声器。"], [/^Standby is running\.$/, "正在进入待机。"],
    [/^Action scheduled( ·.*)?$/, "动作已调度$1"],
    [/^No action was scheduled( ·.*)?$/, "未调度任何动作$1"],
    [/^Waiting for the controller to respond…$/, "等待控制器响应…"],
  ];
  const zhTitle = t => TOAST_ZH[t] || t;
  const zhDetail = d => {
    let out = String(d || "");
    for (const [re, rep] of DETAIL_ZH) if (re.test(out)) { out = out.replace(re, rep); break; }
    return out.replace(/Speaker: On/, "扬声器：开机").replace(/Speaker: Standby/, "扬声器：待机")
              .replace(/Speaker: Unknown/, "扬声器：未知").replace(/^Completed/, "已完成").replace(/^Failed/, "失败");
  };

  // ═════════════════════════════════════════════════════════
  // API（本地回环 HTTP → Python 桥）
  // ═════════════════════════════════════════════════════════
  const api = async (method, ...args) => {
    const response = await fetch(`/api/${method}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ args }),
    });
    const payload = await response.json();
    if (!response.ok || payload.error) {
      const detail = payload.error || "请求失败。";
      toast("error", "控制器错误", detail);
      throw new Error(detail);
    }
    return payload.result;
  };
  const bridge = {
    initialState: () => api("initialState"),
    updates: cursor => api("updates", cursor),
    logs: () => api("logs"),
    refresh: () => api("refresh"),
    togglePower: () => api("togglePower"),
    setVolume: v => api("setVolume", v),
    changeInput: v => api("changeInput", v),
    updateSettings: v => api("updateSettings", v),
    applyTarget: (ip, mac) => api("applyTarget", ip, mac),
    updateStartup: (mode, enabled) => api("updateStartup", mode, enabled),
    runEvent: key => api("runEvent", key),
    scanSpeakers: () => api("scanSpeakers"),
    openLogFolder: () => api("openLogFolder"),
  };

  // ═════════════════════════════════════════════════════════
  // 全局状态
  // ═════════════════════════════════════════════════════════
  let state = null, lastStateJson = "";
  let page = "home";
  let muted = false, lastAudible = 40, volumeTimer = null, editingVol = false, draggingVol = false;
  let volumeHoldUntil = 0; // 用户刚改过音量时，短暂忽略远端快照，避免被旧值覆盖
  let powerPending = false, powerPendingTimer = null;
  let infoOpen = false;
  let testMode = false, runningTest = null;
  let dlg = null; // 选择扬声器弹窗：{ phase: "scanning"|"done", found: [], checked: 0, failed: "" }
  let inputHoldUntil = 0, localInput = null; // 与音量同理：刚点过的输入源短暂优先于远端快照
  let logItems = [], logQuery = "", logSearchTimer = null;
  const LOG_LEVELS = ["ERROR", "WARN", "EVENT", "STATE", "STEP", "INFO"];
  const activeLevels = new Set(LOG_LEVELS);
  let savedFlashTimer = null;

  const ruleOn = key => {
    if (!state || !key) return false;
    const s = state.settings || {};
    for (const section of ["wake", "standby_triggers", "end_session"]) {
      if (s[section] && key in s[section]) return !!s[section][key];
    }
    return false;
  };

  // ═════════════════════════════════════════════════════════
  // Toast
  // ═════════════════════════════════════════════════════════
  function toast(level, title, detail) {
    const el = document.createElement("div");
    el.className = `toast ${level || "info"}`;
    el.innerHTML = `<b>${esc(zhTitle(title))}</b><small>${esc(zhDetail(String(detail || "")))}</small>`;
    $("#toasts").append(el);
    setTimeout(() => el.remove(), 5200);
  }
  function flashSaved() {
    const el = $("#saved-flash");
    if (!el) return;
    el.classList.remove("hidden");
    clearTimeout(savedFlashTimer);
    savedFlashTimer = setTimeout(() => el.classList.add("hidden"), 1600);
  }

  // ═════════════════════════════════════════════════════════
  // 页面骨架（只构建一次，之后定点更新，避免打断滚动/点击）
  // ═════════════════════════════════════════════════════════
  function buildShell() {
    const navMeta = { home: ["home", "主页"], log: ["log", "日志"], settings: ["settings", "设置"] };
    for (const btn of $$(".nav-btn")) {
      const [ic, label] = navMeta[btn.dataset.nav];
      btn.innerHTML = `${icon(ic, 17)}<span>${label}</span>`;
    }
    $("#main").innerHTML = `
      <div id="page-home" class="page">${homeSkeleton()}</div>
      <div id="page-log" class="page hidden">${logSkeleton()}</div>
      <div id="page-settings" class="page hidden">${settingsSkeleton()}</div>`;
    bindHome();
    bindLog();
    bindSettings();
  }

  // ── 主页 ──
  function homeSkeleton() {
    const inputs = [...(state.inputs || [])]
      .sort((a, b) => INPUT_ORDER.indexOf(a.value) - INPUT_ORDER.indexOf(b.value));
    return `
      <div class="status-bar">
        <span id="dot" class="dot"></span>
        <div style="min-width:0">
          <div id="dev-name" class="status-name">—</div>
          <div id="dev-sub" class="status-sub">—</div>
        </div>
        <button id="power-btn" class="power-switch" role="switch">${icon("power", 14)}<span>—</span></button>
      </div>

      <section id="vol-card" class="card">
        <div class="vol-head">
          <span class="card-label">音量</span>
          <button id="vol-display" class="vol-display" title="点击直接输入音量">—</button>
          <input id="vol-edit" class="vol-edit" style="display:none" inputmode="numeric">
        </div>
        <div class="vol-row">
          <button id="mute-btn" class="vol-icon-btn" title="静音">${icon("volume", 19)}</button>

  function bindHome() {
    $("#power-btn").addEventListener("click", () => {
      if (powerPending) return;
      powerPending = true;
      clearTimeout(powerPendingTimer);
      powerPendingTimer = setTimeout(() => { powerPending = false; syncHome(); }, 12000);
      syncHome();
      bridge.togglePower().catch(() => { powerPending = false; syncHome(); });
    });

    const slider = $("#vol-slider");
    slider.addEventListener("pointerdown", () => { draggingVol = true; });
    slider.addEventListener("pointerup", () => { draggingVol = false; });
    slider.addEventListener("input", () => {
      muted = false;
      previewVolume(+slider.value);
    });
    $("#vol-down").addEventListener("click", () => nudge(-1));
    $("#vol-up").addEventListener("click", () => nudge(1));
    $("#mute-btn").addEventListener("click", () => {
      const current = currentVolume();
      if (!muted && current > 0) { muted = true; lastAudible = current; sendVolume(0); }
      else { muted = false; sendVolume(lastAudible || 40); }
      syncHome();
    });

    $("#vol-display").addEventListener("click", () => {
      editingVol = true;
      const edit = $("#vol-edit");
      edit.value = String(currentVolume());
      $("#vol-display").style.display = "none";
      edit.style.display = "";
      edit.focus(); edit.select();
    });
    const commitVol = () => {
      if (!editingVol) return;
      editingVol = false;
      const edit = $("#vol-edit");
      const n = Math.max(0, Math.min(100, parseInt(edit.value, 10) || 0));
      edit.style.display = "none";
      $("#vol-display").style.display = "";
      muted = false;
      sendVolume(n);
      syncHome();
    };
    $("#vol-edit").addEventListener("blur", commitVol);
    $("#vol-edit").addEventListener("keydown", e => {
      if (e.key === "Enter") commitVol();
      if (e.key === "Escape") { editingVol = false; $("#vol-edit").style.display = "none"; $("#vol-display").style.display = ""; }
    });
    $("#vol-edit").addEventListener("input", e => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3);
    });

    $(".input-grid").addEventListener("click", e => {
      const btn = e.target.closest("[data-input]");
      if (!btn || btn.disabled) return;
      localInput = btn.dataset.input;
      inputHoldUntil = Date.now() + 2500;
      bridge.changeInput(localInput).catch(() => {});
      if (state && state.speaker) { state.speaker.input = localInput; syncHome(); }
    });

    $("#info-head").addEventListener("click", () => {
      infoOpen = !infoOpen;
      $("#info-grid").classList.toggle("hidden", !infoOpen);
      $("#info-chevron").innerHTML = icon(infoOpen ? "chevronDown" : "chevronRight", 15);
    });
  }

  const currentVolume = () => {
    const slider = $("#vol-slider");
    return slider ? +slider.value : Number(state?.speaker?.volume || 0);
  };
  function paintVolume(v) {
    const value = Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
    const slider = $("#vol-slider");
    slider.value = value;
    slider.style.setProperty("--volume", `${value}%`);
    $("#vol-display").textContent = String(value);
    $("#mute-btn").innerHTML = icon(value <= 0 ? "volumeX" : "volume", 19);
    $("#mute-btn").title = value <= 0 ? "恢复音量" : "静音";
    $("#mute-btn").querySelector("svg").style.color = value <= 0 ? "var(--danger)" : "";
    $("#mute-note").classList.toggle("hidden", !(muted && value <= 0));
    if (value > 0) lastAudible = value;
    return value;
  }
  function previewVolume(v) {
    const value = paintVolume(v);
    if (state && state.speaker) state.speaker.volume = value;
    volumeHoldUntil = Date.now() + 2500;
    clearTimeout(volumeTimer);
    volumeTimer = setTimeout(() => bridge.setVolume(value).catch(() => {}), 180);
  }
  function sendVolume(v) {
    clearTimeout(volumeTimer);
    const value = paintVolume(v);
    if (state && state.speaker) state.speaker.volume = value;
    volumeHoldUntil = Date.now() + 2500;
    bridge.setVolume(value).catch(() => {});
  }
  function nudge(delta) {
    muted = false;
    sendVolume(currentVolume() + delta);
  }

  function syncHome() {
    if (!state) return;
    const s = state.speaker || {};
    const on = !!s.on;
    $("#dot").className = `dot ${on ? "on" : ""}`;
    $("#dev-name").textContent = s.name || "未找到设备";
    const link = s.ip ? (on ? "已连接 · 开机" : "已连接 · 待机") : "未连接";
    $("#dev-sub").textContent = `${link}${s.ip ? " · " + s.ip : ""}`;

    const pb = $("#power-btn");
    pb.className = `power-switch ${on ? "on" : ""} ${powerPending ? "pending" : ""}`;
    pb.disabled = powerPending;
    pb.setAttribute("aria-checked", String(on));
    pb.innerHTML = powerPending
      ? `${icon("loader", 14, "spin")}<span>切换中</span>`
      : `${icon("power", 14)}<span>${on ? "开机" : "待机"}</span>`;

    if (!editingVol && !draggingVol && s.volume != null && Date.now() > volumeHoldUntil) {
      if (muted && Number(s.volume) > 0) muted = false;
      paintVolume(s.volume);
    }
    $("#vol-card").classList.toggle("dim", !on);
    $("#input-card").classList.toggle("dim", !on);
    const shownInput = (Date.now() < inputHoldUntil && localInput) ? localInput : s.input;
    for (const btn of $$("[data-input]")) {
      btn.classList.toggle("active", btn.dataset.input === shownInput);
      btn.disabled = !on;
    }

    $("#info-summary").textContent = [s.model, s.firmware].filter(Boolean).join(" · ") || "—";
    const vals = [s.ip, s.mac, s.model, s.firmware];
    vals.forEach((v, i) => { $(`#info-v${i}`).textContent = v || "—"; });
  }

  function bindLog() {
    $("#log-refresh").addEventListener("click", () => {

        const allOn = LOG_LEVELS.every(l => activeLevels.has(l));

        if (!allOn) LOG_LEVELS.forEach(l => activeLevels.add(l));
        for (const btn of $$("[data-level]")) btn.classList.toggle("active", activeLevels.has(btn.dataset.level));
        renderLogList();

      }

      activeLevels.has(lvl) ? activeLevels.delete(lvl) : activeLevels.add(lvl);

      renderLogList();
    });
    const box = $("#log-box");
    box.addEventListener("scroll", () => {
      $("#to-bottom").classList.toggle("show", !isNearBottom(box));
    });
    $("#to-bottom").addEventListener("click", () => {
      box.scrollTop = box.scrollHeight;
      $("#to-bottom").classList.remove("show");
    });
  }

  function parseLog(line) {
    const raw = String(line || "");
    const full = raw.match(/^\[([^\]]+)\]\[([^\]]+)\]\s*(.*)$/);
    const short = full ? null : raw.match(/^\[([^\]]+)\]\s*(.*)$/);
    const stamp = full ? full[1] : (short ? short[1] : "");
    const source = full ? full[2] : "";
    const original = full ? full[3] : (short ? short[2] : raw);
    const upper = original.toUpperCase();
    let lvl = "INFO";
    if (/\b(ERROR|EXCEPTION|TRACEBACK|FAILED|FAILURE)\b/.test(upper)) lvl = "ERROR";
    else if (/\b(WARN|WARNING)\b|COULD NOT|IS DISABLED/.test(upper)) lvl = "WARN";
    else if (/\bEVENT\b|\bKIND=/.test(upper)) lvl = "EVENT";
    else if (/\bSTATE\b|\bDESIRED=/.test(upper)) lvl = "STATE";
    else if (/\bSTEP\b|\bSTEP=/.test(upper)) lvl = "STEP";
    const message = original.replace(/^\s*(ERROR|WARN(?:ING)?|EVENT|STATE|STEP|INFO)\s*[:|-]?\s*/i, "");
    return { raw, time: stamp.includes(" ") ? stamp.split(" ").pop() : stamp, source, message, lvl };
  }

  const logMatches = item =>
    activeLevels.has(item.lvl) &&
    (!logQuery.trim() || item.raw.toLowerCase().includes(logQuery.trim().toLowerCase()));

  function logRowHtml(item) {
    return `<div class="log-line ${item.lvl}">
      <span class="log-time">${esc(item.time || "—")}</span>
      <span class="log-lvl ${item.lvl}">${item.lvl}</span>
      <span class="log-txt">${item.source ? esc(item.source) + " · " : ""}${esc(item.message)}</span>
    </div>`;
  }

  function isNearBottom(box) {
    return box.scrollHeight - box.scrollTop - box.clientHeight < 48;
  }

  function renderLogList({ stickBottom = false } = {}) {
    const box = $("#log-box");
    if (!box) return;
    const keep = stickBottom || isNearBottom(box);
    const visible = logItems.filter(logMatches);
    box.innerHTML = visible.length
      ? visible.map(logRowHtml).join("")
      : `<div class="log-empty">没有匹配的日志行</div>`;
    if (keep) box.scrollTop = box.scrollHeight;
    syncLogMeta(visible.length);
  }

  function syncLogMeta(visibleCount) {
    for (const l of LOG_LEVELS) {
      const el = $(`[data-count="${l}"]`);
      if (el) el.textContent = String(logItems.filter(x => x.lvl === l).length);
    }
    const foot = $("#log-foot");
    if (foot) foot.textContent = `显示 ${visibleCount ?? logItems.filter(logMatches).length} / ${logItems.length} 行`;
    const all = $("#lvl-all");
    if (all) all.textContent = LOG_LEVELS.every(l => activeLevels.has(l)) ? "清空" : "全选";
    const box = $("#log-box"), toBottom = $("#to-bottom");
    if (box && toBottom) toBottom.classList.toggle("show", !isNearBottom(box));
  }

  function appendLogLine(line) {
    const item = parseLog(line);
    logItems.push(item);
    if (logItems.length > 800) logItems.splice(0, logItems.length - 800);
    const box = $("#log-box");
    if (!box) return;
    if (logMatches(item)) {
      const keep = isNearBottom(box);
      const empty = box.querySelector(".log-empty");
      if (empty) empty.remove();
      box.insertAdjacentHTML("beforeend", logRowHtml(item));
      while (box.children.length > 800) box.firstElementChild.remove();
      if (keep) box.scrollTop = box.scrollHeight;
    }
    syncLogMeta();
  }

  function loadLogs() {
    bridge.logs().then(lines => {
      logItems = (lines || []).map(parseLog);
      renderLogList({ stickBottom: true });
    }).catch(() => {});
  }

        <button id="dlg-manual-link" class="manual-link">没找到？手动输入 IP 地址</button>
        <div id="dlg-manual" class="manual-box" style="display:none">
          <div class="manual-title">手动指定</div>
          <div class="manual-row">
            <input id="dlg-ip" class="text-input" placeholder="IP 地址，如 10.0.0.222">
            <input id="dlg-mac" class="text-input" placeholder="MAC（可选）">
          </div>
          <div class="manual-actions">
            <button id="dlg-manual-cancel" class="ghost-btn">取消</button>
            <button id="dlg-manual-apply" class="primary-btn" disabled>应用</button>
          </div>
        </div>
        <div class="dlg-foot"><button class="ghost-btn" data-dlg="close">关闭</button></div>
      </div>`;
    document.body.append(el);

    el.addEventListener("click", e => {
      if (e.target === el || e.target.closest("[data-dlg=close]")) { closeSpeakerDialog(); return; }
      const rescan = e.target.closest("#dlg-rescan");
      if (rescan) { startDialogScan(); return; }
      const item = e.target.closest("[data-sp-ip]");
      if (item && !item.classList.contains("current")) {
        bridge.applyTarget(item.dataset.spIp, item.dataset.spMac || "").then(flashSaved).catch(() => {});
        closeSpeakerDialog();
      }
    });
    $("#dlg-manual-link").addEventListener("click", () => {
      $("#dlg-manual-link").style.display = "none";
      $("#dlg-manual").style.display = "";
      $("#dlg-ip").focus();
    });
    $("#dlg-manual-cancel").addEventListener("click", () => {
      $("#dlg-manual").style.display = "none";
      $("#dlg-manual-link").style.display = "";
    });
    $("#dlg-ip").addEventListener("input", () => {
      $("#dlg-manual-apply").disabled = !$("#dlg-ip").value.trim();
    });
    $("#dlg-manual-apply").addEventListener("click", () => {
      const ip = $("#dlg-ip").value.trim();
      if (!ip) return;
      bridge.applyTarget(ip, $("#dlg-mac").value.trim()).then(flashSaved).catch(() => {});
      closeSpeakerDialog();
    });

    startDialogScan();
  }

  function closeSpeakerDialog() {
    dlg = null;
    const el = $("#dlg-backdrop");
    if (el) el.remove();
  }

  function startDialogScan() {
    if (!dlg) return;
    dlg.phase = "scanning";
    dlg.found = [];
    dlg.checked = 0;
    dlg.failed = "";
    syncDialog();
    bridge.scanSpeakers().catch(() => {
      if (!dlg) return;
      dlg.phase = "done";
      dlg.failed = "扫描请求失败，请重试。";
      syncDialog();
    });
  }

  function syncDialog() {
    if (!dlg) return;
    const bar = $("#dlg-scan-bar"), list = $("#dlg-list");
    if (!bar || !list) return;

    bar.classList.toggle("failed", !!dlg.failed);
    if (dlg.phase === "scanning") {
      bar.innerHTML = `${icon("loader", 15, "spin")}<span class="scan-text">正在扫描局域网…${dlg.checked ? ` 已检查 ${dlg.checked} 台设备` : ""}</span>`;
    } else if (dlg.failed) {
      bar.innerHTML = `${icon("alert", 15)}<span class="scan-text">${esc(dlg.failed)}</span>
        <button id="dlg-rescan" class="rescan-btn">${icon("refresh", 12)} 重新扫描</button>`;
    } else {
      const hasCurrent = dlg.found.some(d => normMac(d.mac) === currentTargetMac());
      bar.innerHTML = `${icon("check", 15)}<span class="scan-text">扫描完成，找到 ${dlg.found.length} 台。${hasCurrent ? "已包含你当前的扬声器。" : ""}</span>
        <button id="dlg-rescan" class="rescan-btn">${icon("refresh", 12)} 重新扫描</button>`;
    }

    if (dlg.phase === "scanning" && !dlg.found.length) {
      list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
    } else if (dlg.phase === "done" && !dlg.found.length) {
      list.innerHTML = `<div class="dlg-empty">没有扫描到扬声器</div>`;
    } else {
      const cur = currentTargetMac();
      list.innerHTML = dlg.found.map(d => {
        const isCur = cur && normMac(d.mac) === cur;
        return `
        <button class="sp-item ${isCur ? "current" : ""}" data-sp-ip="${esc(d.ip)}" data-sp-mac="${esc(d.mac || "")}">
          <span class="sp-icon">${icon(isCur ? "check" : "optical", 16)}</span>
          <div style="flex:1;min-width:0">
            <div class="sp-name"><span>${esc(d.name || d.model || "KEF 扬声器")}</span>${isCur ? `<span class="cur-tag">使用中</span>` : ""}</div>
            <div class="sp-meta">IP ${esc(d.ip)}${d.mac ? ` · MAC ${esc(d.mac)}` : ""}</div>
          </div>
          ${isCur ? "" : `<span class="sel-hint">选择</span>`}
        </button>`;
      }).join("") + (dlg.phase === "scanning" ? `<div class="skeleton" style="height:34px"></div>` : "");
    }
  }

  function syncSettings() {
    if (!state) return;
    const dev = (state.settings || {}).device || {};
    const sel = $("#set-input");
    if (sel && document.activeElement !== sel) sel.value = dev.kef_input || "";

    const s = state.speaker || {};
    $("#target-name").textContent = s.name || "未找到设备";
    $("#target-meta").textContent = [s.mac || dev.kef_mac, s.ip || dev.kef_ip].filter(Boolean).join(" · ") || "—";

    // 矩阵
    for (const check of $$("[data-rule]")) {
      const on = ruleOn(check.dataset.rule);
      check.classList.toggle("on-wake", on && check.dataset.checkcol === "wake");
      check.classList.toggle("on-standby", on && check.dataset.checkcol === "standby");
      check.setAttribute("aria-checked", String(on));
    }
    for (const col of ["wake", "standby"]) {
      const keys = EVENT_ROWS.map(r => r[col]).filter(Boolean);
      const allOn = keys.every(ruleOn);
      const hint = $(`[data-col-hint="${col}"]`);
      if (hint) hint.textContent = allOn ? "全部关闭" : "全部开启";
    }
    const enabled = RULE_KEYS.filter(ruleOn).length;
    $("#enabled-count").textContent = `已启用 ${enabled} / ${RULE_KEYS.length} 条规则。`;

    const active = Object.entries(PRESETS).find(([, p]) =>
      RULE_KEYS.every(k => p.values[k] === ruleOn(k)))?.[0];
    for (const btn of $$("[data-preset]")) btn.classList.toggle("active", btn.dataset.preset === active);
    $("#custom-tag").classList.toggle("hidden", !!active);

    // 模拟模式
    $("#matrix").classList.toggle("testing", testMode);
    $("#test-banner").classList.toggle("hidden", !testMode);
    $("#test-foot").style.display = testMode ? "" : "none";
    const toggle = $("#test-toggle");
    toggle.classList.toggle("on", testMode);
    toggle.innerHTML = `${icon("flask", 13)}<span>${testMode ? "退出模拟" : "模拟事件"}</span>`;
    for (const btn of $$("[data-test]")) {
      const on = ruleOn(btn.dataset.testcol);
      btn.classList.toggle("off", !on);
      btn.title = on ? "按当前规则真实执行一次" : "规则已关闭，模拟不会有动作";
      btn.disabled = !!runningTest;
      const running = runningTest === btn.dataset.test;
      btn.firstElementChild.outerHTML = running ? icon("loader", 11, "spin") : icon("play", 11);
    }

    $("#screen-warn").classList.toggle("hidden",
      !(ruleOn("standby_on_display_off") && !ruleOn("wake_on_display_on")));

    const startupSwitch = $("#set-startup-enabled");
    if (document.activeElement !== startupSwitch) startupSwitch.checked = !!(state.startup || {}).registered;
    const modeSel = $("#set-startup-mode");
    if (document.activeElement !== modeSel) {
      modeSel.value = ((state.settings || {}).startup || {}).startup_registration_mode || "registry";
    }
  }

  // 模拟事件结果 → 行内结果条
  function showEventResult(msg) {
    if (msg.state !== "running" && runningTest === msg.key) runningTest = null;
    const row = EVENT_ROWS.find(r => r.tests.some(t => t.key === msg.key));
    syncSettings();
    if (!row) return;
    const box = $(`[data-result="${row.id}"]`);
    if (!box) return;
    const test = row.tests.find(t => t.key === msg.key);
    const iconName = { success: "check", warning: "alert", error: "alert", running: "loader" }[msg.state] || "check";
    box.className = `mx-result show ${esc(msg.state)}`;
    box.innerHTML = `
      ${icon(iconName, 14, msg.state === "running" ? "spin" : "")}
      <div style="min-width:0">
        <div><strong>${esc(test ? test.label : msg.key)}</strong> · ${esc(zhTitle(msg.title))} · ${esc(zhDetail(msg.detail || ""))}</div>
      </div>
      <button class="close">✕</button>`;
  }

  // ═════════════════════════════════════════════════════════
  // 导航与状态应用
  // ═════════════════════════════════════════════════════════
  function setPage(next) {
    page = next;
    for (const btn of $$(".nav-btn")) btn.classList.toggle("active", btn.dataset.nav === next);
    for (const id of ["home", "log", "settings"]) {
      $(`#page-${id}`).classList.toggle("hidden", id !== next);
    }
    if (next === "log") loadLogs();
    if (next === "home") syncHome();
    if (next === "settings") syncSettings();
  }

  function applyState(next) {
    const json = JSON.stringify(next);
    if (json === lastStateJson) return;
    lastStateJson = json;
    const prevOn = state?.speaker?.on;
    state = next;
    if (powerPending && prevOn !== undefined && state.speaker && state.speaker.on !== prevOn) {
      powerPending = false;
      clearTimeout(powerPendingTimer);
    }
    syncHome();
    syncSettings();
  }

  const POWER_ACTION_TITLES = new Set(["Wake", "Standby", "Early Standby", "Endsession Standby", "Speaker action failed"]);

  function handleToast(msg) {
    if (msg.kind === "event") { showEventResult(msg); return; }
    if (msg.kind === "scan") {
      if (!dlg) return; // 弹窗已关，静默丢弃
      if (msg.state === "progress") {
        dlg.checked = Math.max(dlg.checked, Number(msg.checked) || 0);
      } else if (msg.state === "candidate" || msg.state === "complete") {
        dlg.found = [...dlg.found, ...(msg.devices || [])]
          .filter((d, i, a) => d.ip && a.findIndex(x => x.ip === d.ip) === i);
        if (msg.state === "complete") dlg.phase = "done";
      } else if (msg.state === "failed") {
        dlg.phase = "done";
        dlg.failed = msg.detail || "扫描失败。";
      }
      syncDialog();
      return;
    }
    if (msg.kind === "toast" && POWER_ACTION_TITLES.has(msg.title) && powerPending) {
      powerPending = false;
      clearTimeout(powerPendingTimer);
      syncHome();
    }
    toast(msg.level, msg.title, msg.detail);
  }

  // ═════════════════════════════════════════════════════════
  // 启动 + 更新轮询
  // ═════════════════════════════════════════════════════════
  document.querySelector("nav").addEventListener("click", e => {
    const btn = e.target.closest("[data-nav]");
    if (btn) setPage(btn.dataset.nav);
  });

  let updateCursor = 0, polling = false;
  async function pollUpdates() {
    if (polling) return;
    polling = true;
    try {
      const batch = await bridge.updates(updateCursor);
      updateCursor = batch.cursor;
      for (const item of batch.updates) {
        if (item.channel === "state") applyState(JSON.parse(item.payload));
        else if (item.channel === "toast") handleToast(JSON.parse(item.payload));
        else if (item.channel === "log") appendLogLine(item.payload);
      }
    } catch (_error) { /* 下一轮重试 */ }
    finally { polling = false; }
  }

  bridge.initialState().then(value => {
    state = value;
    lastStateJson = JSON.stringify(value);
    buildShell();
    syncHome();
    syncSettings();
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && dlg) closeSpeakerDialog();
    });
    setInterval(pollUpdates, 400);
  }).catch(() => {
    $("#main").innerHTML = `<div class="boot-error"><h1>控制器不可用</h1><p>本地控制接口未能启动，请重启应用。</p></div>`;
  });
  </script>
</body>
</html>
