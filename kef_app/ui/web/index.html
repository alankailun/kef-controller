<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KEF Controller</title>
  <style>
    :root { color-scheme: light dark; --accent:#0f8f83; --accent-ink:#075f57; --bg:#f4f5f6; --panel:rgba(255,255,255,.76); --line:rgba(33,45,53,.12); --ink:#182126; --muted:#607078; --soft:#e8f3f1; --danger:#c93c4a; }
    @media (prefers-color-scheme:dark) { :root { --bg:#202326; --panel:rgba(38,43,46,.78); --line:rgba(255,255,255,.11); --ink:#f1f5f4; --muted:#aebbb9; --soft:#123d39; } }
    * { box-sizing:border-box } body { margin:0; min-width:620px; color:var(--ink); font:14px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif; background:transparent; }
    button,input,select { font:inherit } button { cursor:pointer } .shell { min-height:100vh; display:grid; grid-template-columns:208px minmax(0,1fr); background:var(--bg); }
    .sidebar { padding:42px 12px 16px; border-right:1px solid var(--line); background:rgba(255,255,255,.18); display:flex; flex-direction:column; gap:6px; }
    .brand { padding:0 12px 22px; font-weight:700; font-size:16px; letter-spacing:.1px } .brand small { display:block; color:var(--muted); font-size:11px; font-weight:500; margin-top:2px; }
    .nav { border:0; background:transparent; text-align:left; border-radius:9px; padding:10px 12px; color:var(--muted); font-weight:600; } .nav:hover { background:rgba(127,127,127,.11); color:var(--ink); } .nav.active { color:var(--accent-ink); background:var(--soft); } .sidebar .spacer { flex:1 }
    .content { padding:42px clamp(22px,4vw,52px) 42px; overflow:auto; } h1 { font-size:28px; margin:0 0 5px; letter-spacing:-.6px } .lede { color:var(--muted); margin:0 0 24px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 28px rgba(0,0,0,.045); backdrop-filter:blur(18px); } .card-pad { padding:19px; }
    .status { display:flex; align-items:center; gap:13px; padding:16px 18px; margin-bottom:14px; } .dot { width:10px; height:10px; border-radius:999px; background:#94a3b8; box-shadow:0 0 0 4px rgba(148,163,184,.16); } .dot.on { background:#22a06b; box-shadow:0 0 0 4px rgba(34,160,107,.16) } .dot.standby { background:#d08b26; box-shadow:0 0 0 4px rgba(208,139,38,.16) } .device { flex:1; } .device strong { display:block; font-size:15px; } .device span { color:var(--muted); font-size:12px; } .power-state { min-width:106px; display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 17px; border-radius:10px; border:1px solid var(--line); font-weight:700; } .power-state svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; } .power-state.on { color:#fff; background:#0d9488; border-color:#0d9488; } .power-state.on:hover { background:#087f75; } .power-state.standby { color:var(--muted); background:rgba(255,255,255,.36); } .power-state.standby:hover { color:var(--ink); background:rgba(127,127,127,.1); }
    .primary,.secondary { border-radius:8px; border:1px solid transparent; padding:8px 13px; font-weight:650; } .primary { background:var(--accent); color:white; } .primary:hover { background:#08766c } .secondary { color:var(--ink); background:rgba(127,127,127,.09); border-color:var(--line); } .secondary:hover { background:rgba(127,127,127,.16) } .small { padding:6px 10px; font-size:12px; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(2,minmax(0,1fr)); } .wide { grid-column:1 / -1 } .eyebrow { color:var(--muted); font-size:10px; font-weight:750; letter-spacing:.9px; }
    .volume-card { grid-column:1 / -1; padding:24px 28px 22px; min-height:194px; } .volume-heading { display:flex; align-items:start; justify-content:space-between; margin-bottom:24px; } .volume-heading strong { color:var(--muted); font-size:15px; font-weight:700; } .volume-heading output { color:var(--ink); font-size:40px; line-height:1; font-weight:760; letter-spacing:-1.5px; } .volume-controls { display:grid; grid-template-columns:58px 56px minmax(220px,1fr) 56px; gap:14px; align-items:start; } .volume-button { width:56px; height:56px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:rgba(255,255,255,.38); font-size:29px; font-weight:350; line-height:1; transition:background .15s,border-color .15s,transform .1s; } .volume-button:hover:not(:disabled) { background:rgba(127,127,127,.1); border-color:rgba(15,143,131,.4); } .volume-button:active:not(:disabled) { transform:scale(.97); } .volume-button:disabled { cursor:default; opacity:.42; } .volume-button svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:2; } .volume-slider-wrap { min-width:0; padding-top:2px; } .volume-slider { --volume:0%; appearance:none; width:100%; height:28px; margin:0; background:transparent; cursor:pointer; } .volume-slider:disabled { cursor:default; opacity:.45; } .volume-slider::-webkit-slider-runnable-track { height:8px; border:1px solid rgba(70,82,88,.28); border-radius:999px; background:linear-gradient(to right,var(--accent) 0,var(--accent) var(--volume),#e5e7e8 var(--volume),#e5e7e8 100%); } .volume-slider::-webkit-slider-thumb { appearance:none; width:28px; height:28px; margin-top:-11px; border:0; border-radius:50%; background:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.12); } .volume-slider:focus-visible::-webkit-slider-thumb { outline:3px solid rgba(15,143,131,.23); outline-offset:3px; } .volume-ticks { display:flex; justify-content:space-between; color:#aab2b7; font:12px/1.1 Georgia,serif; padding-top:5px; } .volume-ticks span:first-child { transform:translateX(-1px) } .volume-ticks span:last-child { transform:translateX(2px) }
    .inputs { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:9px; margin-top:12px; } .input { min-height:52px; display:flex; align-items:center; justify-content:center; gap:9px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); } .input svg { width:21px; height:21px; flex:none; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; } .input:hover { border-color:var(--accent); } .input.active { border:2px solid var(--accent); color:var(--accent-ink); background:var(--soft); font-weight:700; }
    .details { display:grid; grid-template-columns:120px 1fr; gap:8px 14px; margin:8px 0 0; } .details dt { color:var(--muted); } .details dd { margin:0; overflow-wrap:anywhere; }
    .table { overflow:hidden; } .event-row { display:grid; grid-template-columns:minmax(180px,1fr) 82px 92px minmax(208px,1fr); align-items:center; min-height:67px; padding:10px 18px; gap:8px; border-top:1px solid var(--line); } .event-row:first-child { border-top:0 } .event-label strong { display:block } .event-label span { display:block; color:var(--muted); font-size:12px; margin-top:2px; } .switch { width:38px; height:22px; appearance:none; background:#aeb8bc; border-radius:999px; position:relative; cursor:pointer; transition:.18s; } .switch:checked { background:var(--accent) } .switch:before { content:""; width:16px; height:16px; border-radius:50%; background:white; position:absolute; left:3px; top:3px; transition:.18s; } .switch:checked:before { left:19px; } .na { color:var(--muted); text-align:center; }
    .tests { display:flex; gap:6px; flex-wrap:wrap; } .result { grid-column:1 / -1; display:none; padding:8px 11px; border-radius:7px; font-size:12px; background:rgba(127,127,127,.1); color:var(--muted); } .result.show { display:block } .result.success { border-left:3px solid #22a06b } .result.warning { border-left:3px solid #d08b26 } .result.error { border-left:3px solid var(--danger) } .result.running { border-left:3px solid var(--accent) }
    .section-title { display:flex; align-items:end; justify-content:space-between; margin:26px 0 10px; } h2 { margin:0; font-size:17px; } .hint { color:var(--muted); font-size:12px; }
    .settings { display:grid; gap:12px; } .setting { display:grid; grid-template-columns:minmax(210px,1fr) minmax(180px,260px); align-items:center; gap:20px; padding:15px 18px; } .setting + .setting { border-top:1px solid var(--line); } .setting strong { display:block; } .setting span { color:var(--muted); font-size:12px; display:block; margin-top:2px; } input[type=text],input[type=number],select { width:100%; color:var(--ink); background:rgba(127,127,127,.08); border:1px solid var(--line); border-radius:7px; padding:8px 9px; outline:none; } input:focus,select:focus { border-color:var(--accent); }
    .toolbar { display:flex; gap:8px; align-items:center; } .toolbar .secondary { display:flex; align-items:center; gap:7px; } .toolbar svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; } .log-search { position:relative; margin:18px 0 12px; } .log-search:before { content:"⌕"; position:absolute; left:16px; top:7px; color:#8795a1; font-size:25px; line-height:1; } .log-search input { width:100%; padding:12px 16px 12px 49px; border:1px solid var(--line); border-radius:11px; background:var(--panel); color:var(--ink); font-size:14px; outline:none; } .log-search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(15,143,131,.12); } .log-filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; } .log-chip { border:1px solid transparent; border-radius:999px; padding:7px 12px; color:white; font:700 11px/1 "Cascadia Mono",Consolas,monospace; opacity:.42; } .log-chip.active { opacity:1; box-shadow:0 2px 8px rgba(0,0,0,.1); } .log-chip.error { background:#76151c } .log-chip.warn { background:#7b3f00 } .log-chip.event { background:#492090 } .log-chip.state { background:#006176 } .log-chip.step { background:#075f2c } .log-chip.info { background:#26354b } .log-panel { height:calc(100vh - 270px); min-height:390px; overflow:auto; background:#101827; color:#d2d9e5; border-radius:12px; padding:10px 12px; font:12px/1.55 "Cascadia Mono",Consolas,monospace; scrollbar-color:#6f7c8e transparent; } .log-row { display:grid; grid-template-columns:82px 68px minmax(0,1fr); gap:10px; align-items:start; padding:6px 8px; border-left:3px solid transparent; border-radius:7px; } .log-row:hover { background:rgba(255,255,255,.045); } .log-row.warn { background:rgba(132,72,0,.18); border-left-color:#f59e0b } .log-row.error { background:rgba(133,20,28,.2); border-left-color:#ef4444 } .log-time { color:#71839d } .log-level { text-align:center; border-radius:4px; padding:2px 5px; font-weight:800; } .log-level.error { color:#ffb4b9; background:#62151b; border:1px solid #8c252e } .log-level.warn { color:#ffd166; background:#5d2e00; border:1px solid #974b00 } .log-level.event { color:#cbb6ff; background:#351470; border:1px solid #5a2ba8 } .log-level.state { color:#67e8f9; background:#064e60; border:1px solid #08758a } .log-level.step { color:#86efac; background:#064e27; border:1px solid #08783b } .log-level.info { color:#cbd5e1; background:#233146; border:1px solid #344864 } .log-message { overflow-wrap:anywhere; white-space:pre-wrap; } .log-empty { padding:46px 20px; color:#7f8da2; text-align:center; } .log-footer { color:var(--muted); font-size:12px; margin:8px 4px 0; }
    .toast-area { position:fixed; z-index:9; top:46px; right:28px; display:grid; gap:8px; width:min(360px,calc(100vw - 48px)); } .toast { padding:12px 14px; border-radius:10px; color:var(--ink); background:var(--panel); border:1px solid var(--line); box-shadow:0 12px 34px rgba(0,0,0,.14); backdrop-filter:blur(16px); } .toast b { display:block; margin-bottom:2px } .toast small { color:var(--muted) } .toast.success { border-left:3px solid #22a06b } .toast.error { border-left:3px solid var(--danger) } .toast.warning { border-left:3px solid #d08b26 } .toast.info { border-left:3px solid var(--accent) }
    @media(max-width:760px) { body { min-width:0 } .shell { grid-template-columns:1fr } .sidebar { position:sticky; z-index:3; top:0; padding:9px; flex-direction:row; overflow:auto; border-bottom:1px solid var(--line); border-right:0; } .brand { display:none } .sidebar .spacer { display:none } .nav { white-space:nowrap } .content { padding:24px 16px } .grid { grid-template-columns:1fr } .volume-card { padding:20px 18px; } .volume-controls { grid-template-columns:52px 48px minmax(150px,1fr) 48px; gap:9px; } .volume-button { width:48px; height:52px; } .event-row { grid-template-columns:minmax(120px,1fr) 52px 52px; } .tests { grid-column:1 / -1 } .setting { grid-template-columns:1fr; gap:8px; } .log-row { grid-template-columns:62px 59px minmax(0,1fr); gap:6px; padding:6px 3px } .log-panel { height:calc(100vh - 320px) } }
  </style>
</head>
<body>
  <div class="shell"><aside class="sidebar"><div class="brand">KEF Controller<small>Wireless speaker control</small></div><button class="nav active" data-page="home">Home</button><button class="nav" data-page="events">Event diagnostics</button><button class="nav" data-page="settings">Settings</button><div class="spacer"></div><button class="nav" data-page="logs">Application log</button></aside><main id="app" class="content"></main></div><div id="toasts" class="toast-area"></div>
  <script>
    let state={}, page='home', results={}, scanned=[], volumeTimer, lastAudibleVolume=40, logQuery='';
    const LOG_KINDS=['error','warn','event','state','step','info'], logKinds=new Set(LOG_KINDS);
    const api=async(method,...args)=>{const response=await fetch(`/api/${method}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({args})});const payload=await response.json();if(!response.ok||payload.error){const detail=payload.error||'The request failed.';toast('error','Controller error',detail);throw new Error(detail)}return payload.result};
    const bridge={initialState:()=>api('initialState'),updates:cursor=>api('updates',cursor),logs:()=>api('logs'),refresh:()=>api('refresh'),togglePower:()=>api('togglePower'),setVolume:value=>api('setVolume',value),changeInput:value=>api('changeInput',value),updateSettings:value=>api('updateSettings',value),applyTarget:(ip,mac)=>api('applyTarget',ip,mac),updateStartup:(mode,enabled)=>api('updateStartup',mode,enabled),runEvent:key=>api('runEvent',key),scanSpeakers:()=>api('scanSpeakers'),openLogFolder:()=>api('openLogFolder')};
    const app=document.querySelector('#app'), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const toast=(level,title,detail)=>{const el=document.createElement('div');el.className=`toast ${level||'info'}`;el.innerHTML=`<b>${esc(title)}</b><small>${esc(detail)}</small>`;document.querySelector('#toasts').append(el);setTimeout(()=>el.remove(),5200)};
    const setPage=p=>{page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render(); if(p==='logs') bridge.logs().then(v=>{state.logs=v;render()}).catch(()=>{})};
    const svgIcon=paths=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths}</svg>`;
    const uiIcon=name=>name==='refresh'?svgIcon('<path d="M20 6v5h-5"></path><path d="M19 11a7.5 7.5 0 1 0 .2 4"></path>'):name==='folder'?svgIcon('<path d="M3 7.5h6l2 2h10v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M3 9.5V6a2 2 0 0 1 2-2h4l2 2h5"></path>'):svgIcon('<path d="M12 2v10"></path><path d="M7.2 5.8a8 8 0 1 0 9.6 0"></path>');
    const inputIcon=value=>{const icons={wifi:'<path d="M3.5 9a13 13 0 0 1 17 0"></path><path d="M6.5 12.5a8.5 8.5 0 0 1 11 0"></path><path d="M9.7 16a3.5 3.5 0 0 1 4.6 0"></path><circle cx="12" cy="19" r=".7" fill="currentColor" stroke="none"></circle>',bluetooth:'<path d="m8 7 8 10V3L8 13l8 8V7z"></path>',tv:'<rect x="3" y="4" width="18" height="13" rx="1.5"></rect><path d="M8 21h8m-4-4v4"></path>',optical:'<circle cx="12" cy="12" r="2"></circle><path d="M7.8 7.8a6 6 0 0 0 0 8.4m8.4-8.4a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14m14-14a10 10 0 0 1 0 14"></path>',coaxial:'<path d="M8 3v5a4 4 0 0 0 8 0V3M6 3h4v4H6zm8 0h4v4h-4zM12 12v9m0-4h6v4"></path>',analog:'<path d="M7 5v14m10-14v14M3 9h4m10 6h4"></path><circle cx="3" cy="9" r="1.5"></circle><circle cx="21" cy="15" r="1.5"></circle>',usb:'<path d="M12 3v13m0-10 4 4m-4 2-4 4m4 0a3 3 0 1 0 3 3"></path><path d="m16 6-1-2h2z"></path><circle cx="8" cy="16" r="1.3"></circle>'};return svgIcon(icons[value]||icons.analog)};
    const inputLabel=value=>({wifi:'Wi-Fi',bluetooth:'蓝牙',tv:'TV (HDMI)',optical:'光纤',coaxial:'同轴',analog:'模拟',usb:'USB'}[value]||value);
    const home=()=>{const s=state.speaker||{}, online=s.on?'on':(s.ip?'standby':''),vol=Math.max(0,Math.min(100,Number(s.volume??0)));if(vol>0)lastAudibleVolume=vol;const disabled=s.on?'':'disabled',order=['wifi','bluetooth','tv','optical','coaxial','analog','usb'],inputs=[...(state.inputs||[])].sort((a,b)=>order.indexOf(a.value)-order.indexOf(b.value));return `<h1>Home</h1><p class="lede">Control your KEF speaker from one place.</p><section class="card status"><i class="dot ${online}"></i><div class="device"><strong>${esc(s.name)}${s.model?` · ${esc(s.model)}`:''}</strong><span>${esc(s.status||'Disconnected')}${s.ip?` · ${esc(s.ip)}`:''}</span></div><button class="power-state ${s.on?'on':'standby'}" onclick="bridge.togglePower()">${uiIcon('power')}<span>${s.on?'开机':'待机'}</span></button></section><div class="grid"><section class="card volume-card"><div class="volume-heading"><strong>音量</strong><output id="volumeOut">${esc(s.volume??'—')}</output></div><div class="volume-controls"><button id="muteButton" class="volume-button" ${disabled} title="${vol>0?'静音':'恢复音量'}" aria-label="${vol>0?'静音':'恢复音量'}" onclick="toggleMute()">${volumeGlyph(vol<=0)}</button><button class="volume-button" ${disabled} title="音量减 5" aria-label="音量减 5" onclick="nudgeVolume(-5)">−</button><div class="volume-slider-wrap"><input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" step="1" value="${vol}" style="--volume:${vol}%" ${disabled} oninput="previewVolume(this)"><div class="volume-ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div><button class="volume-button" ${disabled} title="音量加 5" aria-label="音量加 5" onclick="nudgeVolume(5)">＋</button></div></section><section class="card card-pad"><div class="eyebrow">输入源</div><div class="inputs">${inputs.map(x=>`<button class="input ${s.input===x.value?'active':''}" ${disabled} onclick="bridge.changeInput('${x.value}')">${inputIcon(x.value)}<span>${esc(inputLabel(x.value))}</span></button>`).join('')}</div></section><section class="card card-pad"><div class="eyebrow">DEVICE INFO</div><dl class="details"><dt>IP address</dt><dd>${esc(s.ip||'—')}</dd><dt>MAC address</dt><dd>${esc(s.mac||'—')}</dd><dt>Model</dt><dd>${esc(s.model||'—')}</dd><dt>Firmware</dt><dd>${esc(s.firmware||'—')}</dd></dl></section></div>`};
    const events=()=>`<h1>Event diagnostics</h1><p class="lede">Enable a power behavior and test it from the same row.</p><section class="card table"><div class="event-row" style="min-height:42px"><div class="eyebrow">TRIGGER EVENT</div><div class="eyebrow" style="text-align:center">WAKE</div><div class="eyebrow" style="text-align:center">STANDBY</div><div class="eyebrow">TEST</div></div>${(state.events||[]).map(e=>{const wake=['startup','display-on','unlock'].includes(e.key), standby=!wake;const r=results[e.key];return `<div class="event-row"><div class="event-label"><strong>${esc(e.label)}</strong><span>${esc(e.description)}</span></div><div style="text-align:center">${wake?`<input class="switch" type="checkbox" ${e.enabled?'checked':''} onchange="saveRule('${e.setting}',this.checked)">`:'<span class="na">—</span>'}</div><div style="text-align:center">${standby?`<input class="switch" type="checkbox" ${e.enabled?'checked':''} onchange="saveRule('${e.setting}',this.checked)">`:'<span class="na">—</span>'}</div><div class="tests"><button class="secondary small" onclick="bridge.runEvent('${e.key}')">▶ Simulate</button></div>${r?`<div class="result show ${esc(r.state)}"><b>${esc(r.title)}</b> · ${esc(r.detail)}</div>`:''}</div>`}).join('')}</section>`;
    const settings=()=>{const s=state.settings||{}, ruleRows=[['wake_on_startup','Wake speaker when the app starts'],['standby_on_display_off','Standby when the screen turns off'],['wake_on_display_on','Wake speaker when the screen turns on'],['wake_on_unlock_only','Wake speaker after Windows unlocks'],['standby_on_lock','Standby when Windows locks'],['standby_on_sleep','Standby when Windows sleeps'],['endsession_standby_on_shutdown','Standby when Windows shuts down']];const devices=scanned.map(d=>`<button class="secondary small" onclick="chooseSpeaker('${esc(d.ip)}','${esc(d.mac)}')">${esc(d.name||d.model||'KEF speaker')} · ${esc(d.ip)}${d.mac?` · ${esc(d.mac)}`:''}</button>`).join('');return `<h1>Settings</h1><p class="lede">Changes are applied immediately and saved to your local configuration.</p><div class="section-title"><h2>Speaker</h2></div><section class="card settings"><div class="setting"><div><strong>Find a speaker</strong><span>Search the local network for supported KEF speakers.</span></div><div><button class="secondary" onclick="bridge.scanSpeakers()">Scan network</button>${devices?`<div class="tests" style="margin-top:8px">${devices}</div>`:''}</div></div><div class="setting"><div><strong>Target speaker IP</strong><span>Used to reach your speaker directly.</span></div><input id="set-ip" type="text" value="${esc(s.device?.kef_ip||'')}"></div><div class="setting"><div><strong>Target speaker MAC</strong><span>Lets the controller recover a changed IP address.</span></div><input id="set-mac" type="text" value="${esc(s.device?.kef_mac||'')}"></div><div class="setting"><div><strong>Default input</strong><span>Selected after a wake action.</span></div><select id="set-input">${(state.inputs||[]).map(x=>`<option value="${x.value}" ${s.device?.kef_input===x.value?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div></section><div class="section-title"><h2>Speaker power behavior</h2><span class="hint">Each rule also appears in Event diagnostics.</span></div><section class="card settings">${ruleRows.map(([k,label])=>`<div class="setting"><div><strong>${label}</strong></div><input class="switch" data-setting="${k}" type="checkbox" ${s.wake?.[k]??s.standby_triggers?.[k]??s.end_session?.[k]?'checked':''}></div>`).join('')}</section><div class="section-title"><h2>Windows startup</h2></div><section class="card settings"><div class="setting"><div><strong>Run when I sign in</strong><span>Creates or removes the selected Windows startup registration.</span></div><input id="set-startup-enabled" class="switch" type="checkbox" ${state.startup?.registered?'checked':''}></div><div class="setting"><div><strong>Registration method</strong></div><select id="set-startup"><option value="off" ${s.startup?.startup_registration_mode==='off'?'selected':''}>Off</option><option value="task" ${s.startup?.startup_registration_mode==='task'?'selected':''}>Task Scheduler</option><option value="registry" ${s.startup?.startup_registration_mode==='registry'?'selected':''}>Registry Run</option></select></div></section><p style="margin-top:16px"><button class="primary" onclick="saveSettings()">Save settings</button></p>`};
    const parseLog=line=>{const raw=String(line||''),full=raw.match(/^\[([^\]]+)\]\[([^\]]+)\]\s*(.*)$/),short=full?null:raw.match(/^\[([^\]]+)\]\s*(.*)$/),stamp=full?full[1]:(short?short[1]:''),source=full?full[2]:'',original=full?full[3]:(short?short[2]:raw),upper=original.toUpperCase();let kind='info';if(/\b(ERROR|EXCEPTION|TRACEBACK|FAILED|FAILURE)\b/.test(upper))kind='error';else if(/\b(WARN|WARNING)\b|COULD NOT|IS DISABLED/.test(upper))kind='warn';else if(/\bEVENT\b|\bKIND=/.test(upper))kind='event';else if(/\bSTATE\b|\bDESIRED=/.test(upper))kind='state';else if(/\bSTEP\b|\bSTEP=/.test(upper))kind='step';const message=original.replace(/^\s*(ERROR|WARN(?:ING)?|EVENT|STATE|STEP|INFO)\s*[:|-]?\s*/i,'');return{raw,time:stamp.includes(' ')?stamp.split(' ').pop():stamp,source,message,kind}};
    const logItems=()=>((state.logs||[]).map(parseLog));
    const visibleLogItems=()=>{const q=logQuery.trim().toLowerCase();return logItems().filter(x=>logKinds.has(x.kind)&&(!q||x.raw.toLowerCase().includes(q)))};
    const logRowsMarkup=()=>{const rows=visibleLogItems();return rows.length?rows.map(x=>`<div class="log-row ${x.kind}"><span class="log-time">${esc(x.time||'—')}</span><span class="log-level ${x.kind}">${x.kind.toUpperCase()}</span><span class="log-message">${x.source?`${esc(x.source)} · `:''}${esc(x.message)}</span></div>`).join(''):'<div class="log-empty">没有符合当前条件的日志。</div>'};
    const logs=()=>{const items=logItems(),counts=Object.fromEntries(LOG_KINDS.map(k=>[k,items.filter(x=>x.kind===k).length])),visible=visibleLogItems().length;return `<div class="section-title"><div><h1>应用日志</h1><p class="lede" style="margin:5px 0 0">查看、搜索和筛选控制器的实时诊断记录。</p></div><div class="toolbar"><button class="secondary" onclick="reloadLogs()">${uiIcon('refresh')}<span>刷新</span></button><button class="secondary" onclick="bridge.openLogFolder()">${uiIcon('folder')}<span>打开文件夹</span></button></div></div><div class="log-search"><input id="log-search" type="search" placeholder="搜索日志…" value="${esc(logQuery)}" oninput="setLogQuery(this.value)"></div><div class="log-filters">${LOG_KINDS.map(k=>`<button data-log-kind="${k}" class="log-chip ${k} ${logKinds.has(k)?'active':''}" onclick="toggleLogKind('${k}')">${k.toUpperCase()}&nbsp; <span>${counts[k]}</span></button>`).join('')}</div><div id="log-list" class="log-panel">${logRowsMarkup()}</div><div id="log-footer" class="log-footer">显示 ${visible} / ${items.length} 行</div>`};
    function render(){app.innerHTML=page==='home'?home():page==='events'?events():page==='settings'?settings():logs()}
    function volumeGlyph(muted){return muted?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="m16 9 5 6m0-6-5 6"></path></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"></path></svg>'}
    function updateVolumeUi(value){const v=Math.max(0,Math.min(100,Math.round(Number(value)||0))),out=document.querySelector('#volumeOut'),slider=document.querySelector('#volumeSlider'),mute=document.querySelector('#muteButton');if(out)out.textContent=v;if(slider){slider.value=v;slider.style.setProperty('--volume',`${v}%`)}if(v>0)lastAudibleVolume=v;if(mute){mute.innerHTML=volumeGlyph(v<=0);mute.title=v>0?'静音':'恢复音量';mute.setAttribute('aria-label',mute.title)}return v}
    function previewVolume(input){const v=updateVolumeUi(input.value);clearTimeout(volumeTimer);volumeTimer=setTimeout(()=>bridge.setVolume(v).catch(()=>{}),180)}
    function nudgeVolume(delta){clearTimeout(volumeTimer);const slider=document.querySelector('#volumeSlider'),current=slider?Number(slider.value):Number(state.speaker?.volume||0),value=updateVolumeUi(current+delta);bridge.setVolume(value).catch(()=>{})}
    function toggleMute(){clearTimeout(volumeTimer);const slider=document.querySelector('#volumeSlider'),current=slider?Number(slider.value):Number(state.speaker?.volume||0),value=updateVolumeUi(current>0?0:(lastAudibleVolume||40));bridge.setVolume(value).catch(()=>{})}
    function saveRule(key,value){bridge.updateSettings(JSON.stringify({[key]:value})).catch(()=>{})}
    function chooseSpeaker(ip,mac){document.querySelector('#set-ip').value=ip;document.querySelector('#set-mac').value=mac;bridge.applyTarget(ip,mac).catch(()=>{})}
    function saveSettings(){const c={kef_input:document.querySelector('#set-input').value};document.querySelectorAll('[data-setting]').forEach(x=>c[x.dataset.setting]=x.checked);bridge.updateSettings(JSON.stringify(c)).catch(()=>{});bridge.applyTarget(document.querySelector('#set-ip').value.trim(),document.querySelector('#set-mac').value.trim()).catch(()=>{});bridge.updateStartup(document.querySelector('#set-startup').value,document.querySelector('#set-startup-enabled').checked).catch(()=>{})}
    function reloadLogs(){bridge.refresh().then(()=>bridge.logs()).then(v=>{state.logs=v;render()}).catch(()=>{})}
    function setLogQuery(value){logQuery=value;refreshLogResults()}
    function toggleLogKind(kind){logKinds.has(kind)?logKinds.delete(kind):logKinds.add(kind);render()}
    function refreshLogResults(){const list=document.querySelector('#log-list'),footer=document.querySelector('#log-footer'),items=logItems();if(!list||!footer)return;list.innerHTML=logRowsMarkup();footer.textContent=`显示 ${visibleLogItems().length} / ${items.length} 行`;document.querySelectorAll('[data-log-kind]').forEach(chip=>{const kind=chip.dataset.logKind;chip.querySelector('span').textContent=items.filter(x=>x.kind===kind).length})}
    document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setPage(n.dataset.page));
    window.kefNative={stateChanged(raw){const next=JSON.parse(raw);if(!Object.prototype.hasOwnProperty.call(next,'logs'))next.logs=state.logs||[];state=next;const tag=document.activeElement?.tagName;if(tag!=='INPUT'&&tag!=='SELECT')render()},toast(raw){const msg=JSON.parse(raw);if(msg.kind==='event'){results[msg.key]=msg;render()}else if(msg.kind==='scan'){scanned=[...scanned,...msg.devices].filter((d,i,a)=>d.ip&&a.findIndex(x=>x.ip===d.ip)===i);if(page==='settings')render()}else toast(msg.level,msg.title,msg.detail)},logLine(line){if(page==='logs'){state.logs=[...(state.logs||[]),line].slice(-500);document.activeElement?.id==='log-search'?refreshLogResults():render()}}};
    let updateCursor=0, polling=false;
    async function pollUpdates(){if(polling)return;polling=true;try{const batch=await bridge.updates(updateCursor);updateCursor=batch.cursor;for(const item of batch.updates){if(item.channel==='state')window.kefNative.stateChanged(item.payload);else if(item.channel==='toast')window.kefNative.toast(item.payload);else if(item.channel==='log')window.kefNative.logLine(item.payload)}}catch(_error){}finally{polling=false}}
    bridge.initialState().then(value=>{state=value;render()}).catch(()=>{app.innerHTML='<h1>Controller unavailable</h1><p class="lede">The local controller interface could not be started.</p>'});
    setInterval(pollUpdates,400);
  </script>
</body>
</html>
